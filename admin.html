<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>BULKKOT — Enterprise Store Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070707;
      --panel: #101010;
      --panel-2: #141414;
      --border: #242424;
      --border-soft: #1a1a1a;
      --text: #f5f5f5;
      --muted: #8b8b8b;
      --red: #e31b23;
      --red-dark: #b91017;
      --green: #31c48d;
      --yellow: #f5c542;
      --blue: #70aaff;
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: var(--bg); color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; -webkit-appearance: none; appearance: none; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    input, textarea, select {
      width: 100%; color: var(--text); background: #0b0b0b;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      outline: none; padding: 10px 12px; min-height: 40px;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(227, 27, 35, .15);
    }
    select option { background: #111; color: #fff; }
    .hidden { display: none !important; }

    #loadingOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, .88); display: grid; place-items: center; padding: 20px;
    }
    .loading-spinner {
      width: 32px; height: 32px; margin: 0 auto 12px;
      border: 2px solid #2a2a2a; border-top-color: var(--red);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-align: center; }

    #loginScreen {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px;
      background: radial-gradient(circle at 50% 0%, rgba(227, 27, 35, .15), transparent 45%), var(--bg);
    }
    .login-card {
      width: min(420px, 100%); background: rgba(16, 16, 16, .98);
      border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,.6);
    }
    .brand { font-size: 26px; font-weight: 900; letter-spacing: -1px; }
    .brand span { color: var(--red); }
    .login-subtitle { color: var(--muted); margin: 6px 0 24px; font-size: 13px; }
    .login-error { color: #ff5555; font-size: 12px; margin-bottom: 14px; min-height: 18px; line-height: 1.4; font-weight: 600; text-align: center; }

    .field { margin-bottom: 15px; }
    .field label { display: block; margin-bottom: 6px; color: #ccc; font-size: 11px; font-weight: 700; text-transform: uppercase; }

    .btn {
      border: 1px solid transparent; border-radius: var(--radius-sm);
      padding: 9px 14px; min-height: 38px; color: var(--text); background: #202020;
      font-weight: 700; font-size: 12px; text-align: center; transition: .15s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: #2a2a2a; }
    .btn-primary { background: var(--red); border-color: var(--red); }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-danger { background: rgba(239, 68, 68, .12); border-color: rgba(239, 68, 68, .25); color: #ff7777; }
    .btn-danger:hover { background: rgba(239, 68, 68, .25); }
    .btn-full { width: 100%; }
    .btn-small { min-height: 30px; padding: 4px 8px; font-size: 10px; }

    #app { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; background: #0a0a0a;
      border-right: 1px solid var(--border); padding: 20px 12px;
      display: flex; flex-direction: column; z-index: 200; overflow-y: auto;
    }
    .sidebar-logo { padding: 4px 10px 20px; font-size: 20px; font-weight: 900; }
    .sidebar-logo span { color: var(--red); }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      width: 100%; border: 0; text-align: left; color: #888; background: transparent;
      padding: 11px 12px; border-radius: 8px; font-weight: 700; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-btn:hover, .nav-btn.active { color: #fff; background: rgba(227, 27, 35, .15); }
    .nav-badge { background: var(--red); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 999px; }
    .sidebar-bottom { margin-top: auto; padding-top: 20px; }
    .user-email { color: var(--muted); font-size: 10px; padding: 10px; word-break: break-all; }

    .main { min-width: 0; width: 100%; }
    .topbar {
      height: 64px; padding: 0 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(8, 8, 8, .92); position: sticky; top: 0; z-index: 100;
    }
    .page-title { font-size: 18px; font-weight: 800; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .content { padding: 24px; max-width: 1500px; margin: 0 auto; }

    .mobile-menu-btn { display: none; font-size: 18px; padding: 7px 11px; }
    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 150; }

    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 900; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .panel-title { font-size: 15px; font-weight: 800; }
    .panel-subtitle { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .table-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--border-soft); background: #0c0c0c; }
    .table-toolbar input { max-width: 280px; min-height: 36px; font-size: 11px; }
    .table-toolbar select { max-width: 180px; min-height: 36px; font-size: 11px; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 12px; }
    th { text-align: left; color: #666; font-size: 9px; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 14px; border-bottom: 1px solid #161616; vertical-align: middle; }
    .empty { color: var(--muted); text-align: center; padding: 36px !important; }

    .badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; font-size: 8px; font-weight: 800; text-transform: uppercase; }
    .badge-placed { background: rgba(245, 197, 66, .12); color: var(--yellow); }
    .badge-packed { background: rgba(112, 170, 255, .12); color: var(--blue); }
    .badge-shipped { background: rgba(112, 170, 255, .2); color: #9cc2ff; }
    .badge-out-for-delivery { background: rgba(245, 197, 66, .2); color: #ffd666; }
    .badge-delivered { background: rgba(49, 196, 141, .15); color: var(--green); }
    .badge-cancelled { background: rgba(239, 68, 68, .12); color: #ff7777; }
    .badge-live { background: rgba(49, 196, 141, .15); color: var(--green); }
    .badge-hidden { background: rgba(139, 139, 139, .2); color: #aaa; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding: 20px; }
    .product-card { background: #0e0e0e; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .product-card.is-hidden { opacity: 0.6; border-style: dashed; }
    .product-image-wrap { position: relative; aspect-ratio: 1/1; background: #151515; }
    .product-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .product-card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
    .product-card-title { font-size: 14px; font-weight: 800; color: #fff; margin: 0 0 4px; }
    .product-card-meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .stock-chip-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
    .stock-chip { padding: 3px 6px; background: #161616; border: 1px solid var(--border-soft); border-radius: 4px; font-size: 10px; font-weight: 700; }
    .stock-chip.low { border-color: rgba(245, 197, 66, 0.5); color: var(--yellow); }
    .stock-chip.out { border-color: rgba(239, 68, 68, 0.5); color: #ff7777; }
    .product-actions-row { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid #1c1c1c; }

    .modal { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.85); display: grid; place-items: center; padding: 20px; }
    .modal-box { width: min(720px, 100%); max-height: 90vh; overflow-y: auto; background: #101010; border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .close-btn { background: transparent; border: 0; color: #888; font-size: 24px; cursor: pointer; }

    #toastContainer { position: fixed; right: 20px; bottom: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 40px)); }
    .toast { padding: 12px 16px; background: #161616; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--green); }
    .toast.error { border-color: rgba(239, 68, 68, .4); color: #ff7777; }

    @media (max-width: 900px) {
      #app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; top: 0; left: 0; width: 260px; height: 100%;
        transform: translateX(-100%); transition: transform 0.25s ease;
      }
      body.sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-open .sidebar-backdrop { display: block; }
      .mobile-menu-btn { display: inline-flex; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stats .stat:last-child { grid-column: 1 / -1; }
      .topbar { padding: 0 16px; }
      .content { padding: 16px; }
    }
  </style>
</head>

<body>

  <div id="loadingOverlay" class="hidden">
    <div style="text-align:center;">
      <div class="loading-spinner"></div>
      <div id="loadingText">AUTHENTICATING...</div>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- LOGIN SCREEN (DIV CONTAINER - IMPOSSIBLE TO REFRESH) -->
  <section id="loginScreen">
    <div class="login-card">
      <div class="brand">불꽃 <span>BULKKOT</span></div>
      <p class="login-subtitle">Enterprise Store Operations</p>
      
      <div id="loginFormControls">
        <div class="field">
          <label>Admin Email</label>
          <input id="loginEmail" type="text" placeholder="bulkkotwear@gmail.com" value="bulkkotwear@gmail.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••">
        </div>
        <div id="loginError" class="login-error" aria-live="polite"></div>
        <button id="loginButton" class="btn btn-primary btn-full" type="button">SIGN IN TO PORTAL</button>
      </div>
    </div>
  </section>

  <!-- DASHBOARD APP -->
  <section id="app" class="hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">불꽃 <span>BULKKOT</span></div>
      <nav class="nav">
        <button class="nav-btn active" data-page="dashboard" type="button">◈ Dashboard</button>
        <button class="nav-btn" data-page="orders" type="button">≡ Orders</button>
        <button class="nav-btn" data-page="products" type="button">□ Products & Catalog</button>
      </nav>
      <div class="sidebar-bottom">
        <div id="userEmail" class="user-email"></div>
        <button id="logoutButton" class="btn btn-danger btn-full" type="button">LOGOUT</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button id="mobileMenuButton" class="btn mobile-menu-btn" type="button">☰</button>
          <div id="pageTitle" class="page-title">Dashboard</div>
        </div>
        <div class="topbar-actions">
          <button id="refreshButton" class="btn btn-small" type="button">↻ Refresh</button>
          <a href="index.html" target="_blank" rel="noopener" class="btn btn-small" style="text-decoration:none;">Storefront ↗</a>
        </div>
      </header>

      <div class="content">
        <!-- DASHBOARD -->
        <section id="page-dashboard" class="page">
          <div class="stats">
            <div class="stat"><div class="stat-label">Total Orders</div><div id="statTotalOrders" class="stat-value">0</div></div>
            <div class="stat"><div class="stat-label">Total Revenue</div><div id="statRevenue" class="stat-value">₹0</div></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div><div class="panel-title">Recent Customer Orders</div></div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Order #</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
                <tbody id="recentOrdersBody"><tr><td colspan="5" class="empty">No orders found.</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ORDERS -->
        <section id="page-orders" class="page hidden">
          <div class="panel">
            <div class="panel-header"><div class="panel-title">Order Management</div></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Order #</th><th>Customer</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="ordersBody"><tr><td colspan="5" class="empty">No orders found.</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- PRODUCTS -->
        <section id="page-products" class="page hidden">
          <div class="panel">
            <div class="panel-header"><div class="panel-title">Catalog</div></div>
            <div id="productsGrid" class="product-grid"></div>
          </div>
        </section>
      </div>
    </main>
  </section>

  <div id="toastContainer"></div>

  <script>
    (function() {
      const SUPABASE_URL = "https://pgubjluqgqvrybvehzeh.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP";

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loginScreen = document.getElementById("loginScreen");
      const app = document.getElementById("app");
      const loginBtn = document.getElementById("loginButton");
      const emailInput = document.getElementById("loginEmail");
      const passInput = document.getElementById("loginPassword");
      const errBox = document.getElementById("loginError");
      const userEmailEl = document.getElementById("userEmail");
      const overlay = document.getElementById("loadingOverlay");

      function setLoading(show, text) {
        if (text) document.getElementById("loadingText").textContent = text;
        overlay.classList.toggle("hidden", !show);
      }

      function showToast(msg, isErr = false) {
        const c = document.getElementById("toastContainer");
        const t = document.createElement("div");
        t.className = `toast ${isErr ? 'error' : ''}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }

      function openDashboard(user) {
        loginScreen.classList.add("hidden");
        app.classList.remove("hidden");
        userEmailEl.textContent = user.email || "Admin";
        loadDashboardData();
      }

      async function doLogin() {
        const email = emailInput.value.trim().toLowerCase();
        const password = passInput.value;

        if (!email || !password) {
          errBox.textContent = "Please fill in email and password.";
          return;
        }

        errBox.textContent = "";
        loginBtn.disabled = true;
        loginBtn.textContent = "VERIFYING...";
        setLoading(true, "CHECKING CREDENTIALS...");

        try {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (data && data.user) {
            openDashboard(data.user);
          } else {
            throw new Error("Login failed without error response.");
          }
        } catch (err) {
          console.error("Login catch:", err);
          errBox.textContent = err.message || "Invalid credentials.";
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "SIGN IN TO PORTAL";
          setLoading(false);
        }
      }

      loginBtn.addEventListener("click", (e) => {
        e.preventDefault();
        doLogin();
      });

      passInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          doLogin();
        }
      });

      document.getElementById("logoutButton").addEventListener("click", async () => {
        await sb.auth.signOut();
        app.classList.add("hidden");
        loginScreen.classList.remove("hidden");
      });

      // Auto check active session
      sb.auth.getUser().then(({ data: { user } }) => {
        if (user) openDashboard(user);
      });

      // Safe Data Loader (Does NOT crash the UI)
      async function loadDashboardData() {
        try {
          const { data: orders } = await sb.from("orders").select("*").order("created_at", { ascending: false });
          if (orders && orders.length) {
            document.getElementById("statTotalOrders").textContent = orders.length;
            const rev = orders.reduce((s, o) => s + Number(o.total || 0), 0);
            document.getElementById("statRevenue").textContent = "₹" + rev.toLocaleString("en-IN");
            
            const rows = orders.map(o => `
              <tr>
                <td><strong>${o.order_number || o.id.slice(0,8)}</strong></td>
                <td>${o.customer_name || 'Guest'}</td>
                <td>₹${Number(o.total||0).toLocaleString("en-IN")}</td>
                <td>${o.order_status || 'PLACED'}</td>
                <td>${new Date(o.created_at).toLocaleDateString()}</td>
              </tr>
            `).join("");
            document.getElementById("recentOrdersBody").innerHTML = rows;
            document.getElementById("ordersBody").innerHTML = rows;
          }
        } catch (e) {
          console.warn("Orders fetch failed:", e);
        }

        try {
          const { data: prods } = await sb.from("products").select("*").order("created_at", { ascending: false });
          if (prods && prods.length) {
            document.getElementById("productsGrid").innerHTML = prods.map(p => `
              <div class="product-card">
                <div class="product-image-wrap"><img src="${p.image_url || '13575.png'}"></div>
                <div class="product-card-body">
                  <div class="product-card-title">${p.name}</div>
                  <div class="product-card-meta">₹${p.price}</div>
                </div>
              </div>
            `).join("");
          }
        } catch (e) {
          console.warn("Products fetch failed:", e);
        }
      }

      // Nav Tab switching
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const p = btn.dataset.page;
          document.querySelectorAll(".page").forEach(page => page.classList.add("hidden"));
          document.getElementById(`page-${p}`)?.classList.remove("hidden");
          document.getElementById("pageTitle").textContent = btn.textContent.replace(/[^a-zA-Z]/g, '');
        });
      });
    })();
  </script>
</body>
</html>
