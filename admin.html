<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BULKKOT Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#050505; --surface:#0E0E0E; --surface-2:#161616; --border:rgba(255,255,255,.1);
  --muted:#8E8B87; --ink:#F5F3EF; --flame:#E50914;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--ink);}
h1,h2,h3{font-family:'Montserrat',sans-serif;}
button{cursor:pointer;border:none;font-family:inherit;}
input,textarea,select{font-family:inherit;}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:32px 24px;}
.login-brand{font-size:12px;letter-spacing:.15em;color:var(--flame);font-weight:800;margin-bottom:8px; display:block;}
.login-box h1{font-size:22px;margin-bottom:24px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12px;color:var(--muted);font-weight:600;}
.field input{background:var(--surface-2);border:1px solid var(--border);color:#FFF;padding:12px;font-size:13px;border-radius:5px;outline:none;width:100%;}
.btn{border-radius:5px;font-weight:700;font-size:13px;padding:12px 18px;cursor:pointer;}
.btn-primary{background:#FFF;color:#000;width:100%;border:none;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
#login-error{color:var(--flame);font-size:13px;margin-top:12px;font-weight:500;}

#app{display:none;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;z-index:50;}
.sidebar-brand{font-size:12px;letter-spacing:.15em;color:var(--flame);font-weight:800;padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:6px;color:var(--muted);font-size:14px;font-weight:600;background:transparent;width:100%;text-align:left;margin-bottom:6px;}
.nav-item.active{color:var(--ink);background:rgba(229,9,20,.12);border-left:3px solid var(--flame);}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:10px 12px;width:100%;border-radius:5px;}

.main{margin-left:240px;padding:32px 40px;max-width:1200px;}
.page{display:none;}
.page.active{display:block;}
.page-header{margin-bottom:32px;}
.page-header h1{font-size:26px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px;}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:8px;}
.stat-card .value{font-size:32px;font-weight:800;font-family:'Montserrat',sans-serif;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:26px;margin-bottom:26px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <span class="login-brand">불꽃 BULKKOT</span>
    <h1>Admin Sign In</h1>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
    </form>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="sidebar-brand">불꽃 BULKKOT ADMIN</div>
    <button class="nav-item active" data-page="dashboard">📊 Dashboard</button>
    <div class="sidebar-footer">
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px;" id="who-am-i"></div>
      <button class="btn btn-logout" id="logout-btn">Sign Out</button>
    </div>
  </aside>
  <main class="main">
    <section class="page active" id="page-dashboard">
      <div class="page-header"><h1>Dashboard Overview</h1></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">TOTAL ORDERS</div><div class="value" id="stat-orders">0</div></div>
        <div class="stat-card"><div class="label">TOTAL REVENUE</div><div class="value" id="stat-revenue">₹0</div></div>
      </div>
    </section>
  </main>
</div>

<!-- DIRECT SCRIPT AT THE VERY END (NO DOMCONTENTLOADED HASSLE) -->
<script>
const SUPABASE_URL = 'https://pgubjluqgqvrybvehzeh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBndWJqbHVxZ3F2cnlidmVoemVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NTQ1MTAsImV4cCI6MjA1NDQzMDUxMH0.F_r3N9p_yG8fK2kS9r_mN2i-5uB-0aK8rX8d4L2wV4';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('login-screen');
const appShell = document.getElementById('app');
const loginForm = document.getElementById('login-form');

// Check active session immediately
supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    loginScreen.style.display = 'none';
    appShell.style.display = 'block';
    document.getElementById('who-am-i').textContent = session.user.email;
  }
});

// Handle Login Form Submit directly
loginForm.onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errorBox = document.getElementById('login-error');

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errorBox.textContent = '';

  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errorBox.textContent = 'Error: ' + error.message;
    btn.disabled = false;
    btn.textContent = 'Sign In';
    return;
  }

  loginScreen.style.display = 'none';
  appShell.style.display = 'block';
  document.getElementById('who-am-i').textContent = data.session.user.email;
};

document.getElementById('logout-btn').onclick = async () => {
  await supabase.auth.signOut();
  window.location.reload();
};
</script>
</body>
</html>
