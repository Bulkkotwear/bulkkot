<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070707">
<title>BULKKOT ADMIN · 불꽃</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#070707;--pn:#101010;--bd:#1c1c1c;--bd2:#292929;--tx:#f2f2f2;--mu:#8a8a8a;--ac:#e31b23}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 Helvetica,Arial,sans-serif}
a,button{font:inherit;color:inherit}button{cursor:pointer}
.m{color:var(--mu)}.err{border:1px solid var(--ac);padding:12px;color:var(--ac)}
h1{font-size:20px;letter-spacing:.12em;text-transform:uppercase}h2{font-size:12px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase;margin:0 0 10px}
.btn{background:transparent;border:1px solid var(--bd2);padding:8px 14px;letter-spacing:.08em;font-size:12px;text-transform:uppercase}
.btn:hover{border-color:var(--tx)}.btn.p{background:var(--ac);border-color:var(--ac)}.btn.d{color:var(--ac);border-color:var(--ac)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd2);color:var(--tx);padding:9px 10px;font:inherit;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}textarea{min-height:70px;font-family:monospace;font-size:12px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:100%;max-width:340px;background:var(--pn);border:1px solid var(--bd);padding:28px;display:grid;gap:12px}
.logo{font-size:22px;letter-spacing:.2em;font-weight:700}.logo b{color:var(--ac)}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:18px 0;z-index:20;transition:transform .2s}
aside .logo{padding:0 20px 14px;font-size:17px}aside h3{font-size:10px;letter-spacing:.18em;color:var(--mu);padding:14px 20px 4px}
aside a{display:block;padding:8px 20px;color:var(--mu);cursor:pointer;border-left:2px solid transparent}
aside a:hover{color:var(--tx)}aside a.on{color:var(--tx);border-left-color:var(--ac);background:var(--bg)}
main{margin-left:230px;padding:24px;max-width:1400px}
.top{display:none;position:sticky;top:0;z-index:10;background:var(--pn);border-bottom:1px solid var(--bd);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));align-items:center;gap:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar input{max-width:260px}.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--pn);border:1px solid var(--bd);padding:16px}.card .n{font-size:26px;font-weight:700;margin-top:4px}.card .n.r{color:var(--ac)}
.tw{overflow-x:auto;border:1px solid var(--bd)}table{border-collapse:collapse;width:100%;background:var(--pn)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);background:var(--bg)}tbody tr{cursor:pointer}tbody tr:hover{background:#151515}
.chip{border:1px solid var(--bd2);background:none;padding:4px 10px;font-size:12px}.chip.on{border-color:var(--ac);color:var(--ac)}
.th{width:34px;height:34px;object-fit:cover;border:1px solid var(--bd2);vertical-align:middle}
#mb{position:fixed;inset:0;background:#000c;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:20px 12px}
#md{background:var(--pn);border:1px solid var(--bd2);width:100%;max-width:640px;padding:22px}
.f{margin-bottom:12px}.f label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.row{display:flex;gap:8px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}.bars div{flex:1;background:var(--ac);min-height:2px;position:relative}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.mg .card{padding:8px;font-size:11px;word-break:break-all}.mg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-bottom:6px}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:#000;padding:10px 18px;display:none;z-index:99;max-width:90%}#t.b{background:var(--ac);color:#fff}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.o{transform:none}main{margin:0;padding:16px}.top{display:flex}}
</style></head><body>
<div id="login"><form id="lf"><div class="logo"><b>불꽃</b> BULKKOT</div><div class="m">ADMIN ACCESS</div>
<input id="em" type="email" placeholder="Email" autocomplete="username" required>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<input id="otp" inputmode="numeric" placeholder="2FA code" style="display:none">
<button class="btn p" id="lb">Sign in</button><div class="m" id="le"></div></form></div>
<div id="app"><div class="top"><button class="btn" onclick="nav.classList.toggle('o')">☰</button><span class="logo" style="font-size:15px"><b>불꽃</b> BULKKOT</span></div>
<aside id="nav"></aside><main id="main"></main></div>
<div id="mb"><div id="md"></div></div><div id="t"></div>
<script>
const SB_URL='https://pgubjluqgqvrybvehzeh.supabase.co',SB_KEY='sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP',ADMIN='bulkkotwear@gmail.com';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('#main'),nav=$('#nav'),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
let tt;function toast(m,bad){const t=$('#t');t.textContent=m;t.className=bad?'b':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
const BUCKETS=['product-images','site-media','product-media','site-content-images'];
const NAV=[['Overview',[['dashboard','Dashboard'],['analytics','Analytics']]],['Sell',[['orders','Orders'],['products','Products'],['categories','Categories'],['inventory','Inventory'],['coupons','Coupons']]],['People',[['customers','Customers'],['accounts','Accounts'],['waitlist','VIP Waitlist'],['newsletter','Newsletter']]],['Website',[['announcement','Announcement Bar'],['content','Site Content'],['policies','Policies'],['media','Media Library']]],['Admin',[['settings','Store Settings'],['admins','Admin Users'],['audit','Audit Log'],['system','System']]]];
const T={orders:{table:'orders',order:'created_at',kids:'order_items',fk:'order_id'},products:{table:'products',order:'created_at'},categories:{table:'categories'},inventory:{table:'inventory_movements',order:'created_at',ro:1},coupons:{table:'coupons'},accounts:{table:'customer_profiles'},admins:{table:'admin_users'},audit:{table:'audit_log',order:'created_at',ro:1},waitlist:{table:'waitlist',order:'created_at'},newsletter:{table:'newsletter',order:'created_at'},announcement:{table:'announcement_settings'},content:{table:'site_content'},policies:{table:'policies'},settings:{table:'store_settings'}};
const TITLES={};NAV.forEach(g=>g[1].forEach(p=>TITLES[p[0]]=p[1]));
const STATUS=['new','processing','packed','shipped','out_for_delivery','delivered','cancelled','returned','refunded'];

/* AUTH */
$('#lf').onsubmit=async e=>{e.preventDefault();const le=$('#le');le.textContent='';$('#lb').disabled=true;
 try{
  let {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)throw error;
  if((data.user.email||'').toLowerCase()!==ADMIN){await sb.auth.signOut();throw new Error('Not an admin account')}
  const a=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data;
  if(a&&a.nextLevel==='aal2'&&a.currentLevel!=='aal2'){
   const o=$('#otp');if(o.style.display==='none'){o.style.display='block';o.focus();throw new Error('Enter 2FA code, then sign in again')}
   const f=(await sb.auth.mfa.listFactors()).data.totp[0];
   const r=await sb.auth.mfa.challengeAndVerify({factorId:f.id,code:o.value.trim()});if(r.error)throw r.error}
  start();
 }catch(x){le.style.color='#e31b23';le.textContent=x.message}$('#lb').disabled=false};
async function boot(){const {data}=await sb.auth.getSession();const u=data.session&&data.session.user;
 if(u&&(u.email||'').toLowerCase()===ADMIN){const a=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data;if(!(a&&a.nextLevel==='aal2'&&a.currentLevel!=='aal2'))return start()}
 $('#login').style.display='flex'}
function start(){$('#login').style.display='none';$('#app').style.display='block';
 nav.innerHTML='<div class="logo"><b>불꽃</b> BULKKOT</div>'+NAV.map(g=>`<h3>${g[0].toUpperCase()}</h3>`+g[1].map(p=>`<a data-p="${p[0]}" onclick="go('${p[0]}')">${p[1]}</a>`).join('')).join('')+'<h3>SESSION</h3><a onclick="out()">Sign out</a>';
 sb.channel('ord').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},()=>toast('🔔 New order received')).subscribe();
 go((location.hash||'#dashboard').slice(1))}
async function out(){await sb.auth.signOut();location.hash='';location.reload()}

/* ROUTER */
function go(p){if(!TITLES[p])p='dashboard';location.hash=p;nav.classList.remove('o');$$('aside a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===p));window.scrollTo(0,0);
 const F={dashboard,analytics,media,system,customers};F[p]?F[p]():grid(p)}
const head=(t,x='')=>`<div class="bar" style="margin-top:0"><h1>${t}</h1><span class="sp"></span>${x}</div>`;

/* DATA */
async function list(c){let r;if(c.order){r=await sb.from(c.table).select('*').order(c.order,{ascending:false}).limit(2000);if(!r.error)return r}return sb.from(c.table).select('*').limit(2000)}
const amt=r=>{for(const k of['total','total_amount','grand_total','amount','subtotal'])if(r[k]!=null)return Number(r[k])||0;return 0};
const bad=s=>/cancel|return|refund/i.test(s||'');
const stk=p=>{let s=p.stock??p.stock_quantity??p.inventory;if(s==null)return 99;if(typeof s==='object')return Object.values(s).reduce((a,b)=>a+(Number(typeof b==='object'?(b&&(b.stock??b.qty)):b)||0),0);return Number(s)||0};
async function log(a,t,id,d){try{await sb.from('audit_log').insert({actor:ADMIN,action:a,tbl:t,record_id:String(id??''),details:d})}catch(e){}}

/* GENERIC TABLE */
let S={};
async function grid(k){const c=T[k];S={k,c,f:'',q:''};main.innerHTML='<p class="m">Loading…</p>';
 const {data,error}=await list(c);if(error){main.innerHTML=head(TITLES[k])+`<div class="err">${esc(error.message)}<br><span class="m">Table "${c.table}" missing or blocked by RLS. Run the SQL setup.</span></div>`;return}
 S.rows=data;S.cols=data.length?Object.keys(data[0]):[];draw()}
function draw(){const {k,c,rows,cols}=S;const sc=cols.includes('status')?[...new Set(rows.map(r=>r.status).filter(Boolean))]:[];
 const v=rows.filter(r=>(!S.f||r.status===S.f)&&(!S.q||JSON.stringify(r).toLowerCase().includes(S.q)));S.v=v;
 const show=cols.slice(0,7);
 main.innerHTML=head(TITLES[k]+` <span class="m" style="font-size:13px">(${v.length})</span>`,`<button class="btn" onclick="csv()">Export CSV</button>${k==='orders'?'<button class="btn" onclick="bulk()">Bulk status</button>':''}${c.ro?'':'<button class="btn p" onclick="edit(-1)">+ Add</button>'}`)+
 `<div class="bar"><input id="sq" placeholder="Search…" value="${esc(S.q)}">${sc.length?`<button class="chip ${S.f?'':'on'}" onclick="S.f='';draw()">All</button>`+sc.map(s=>`<button class="chip ${S.f===s?'on':''}" onclick="S.f='${esc(s)}';draw()">${esc(s)}</button>`).join(''):''}</div>`+
 (v.length?`<div class="tw"><table><thead><tr>${show.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${v.map(r=>`<tr onclick="edit(${rows.indexOf(r)})">${show.map(x=>`<td>${cell(r[x])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="m">No records.</p>');
 const q=$('#sq');q.oninput=()=>{S.q=q.value.toLowerCase();const p=q.selectionStart;draw();const n=$('#sq');n.focus();n.setSelectionRange(p,p)}}
function cell(v){if(v==null||v==='')return '<span class="m">—</span>';if(typeof v==='object'){const s=JSON.stringify(v);return esc(s.length>40?s.slice(0,40)+'…':s)}
 if(typeof v==='string'&&/^https?:.*\.(png|jpe?g|webp|gif|avif)/i.test(v))return `<img class="th" src="${esc(v)}">`;
 if(typeof v==='boolean')return v?'✔':'✘';const s=String(v);return esc(s.length>40?s.slice(0,40)+'…':s)}
function csv(){const {v,cols,k}=S;if(!v.length)return;const q=x=>'"'+String(x==null?'':typeof x==='object'?JSON.stringify(x):x).replace(/"/g,'""')+'"';
 const b=new Blob([[cols.map(q).join(',')].concat(v.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`bulkkot-${k}-${new Date().toISOString().slice(0,10)}.csv`;a.click()}

/* EDITOR */
const IMG=/image|img|photo|thumb|media|gallery|logo|banner|hero/i;
async function edit(i){const {c,rows,cols}=S,r=i>=0?rows[i]:null,pk=c.pk||'id';
 let h=`<h2>${r?'Edit':'New'} · ${esc(c.table)}</h2>`;
 if(!cols.length)h+=`<div class="f"><label>Record as JSON (table is empty, columns unknown)</label><textarea id="raw" style="min-height:160px">{\n  \n}</textarea></div>`;
 else cols.forEach(f=>{const v=r?r[f]:null,ro=r&&(f===pk||/^(created_at|updated_at)$/.test(f)),t=typeof v;
  let inp,ty='s';
  if(f==='status'&&c.k!==0&&S.k==='orders'){inp=`<select data-k="${f}" data-t="s">${[...new Set([...(v?[v]:[]),...STATUS])].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`}
  else if(t==='boolean'){ty='b';inp=`<select data-k="${f}" data-t="b"><option ${v?'selected':''}>true</option><option ${!v?'selected':''}>false</option></select>`}
  else if(v&&t==='object'){ty='j';inp=`<textarea data-k="${f}" data-t="j">${esc(JSON.stringify(v,null,1))}</textarea>`}
  else if(t==='number'){ty='n';inp=`<input type="number" step="any" data-k="${f}" data-t="n" value="${v}" ${ro?'disabled':''}>`}
  else if(typeof v==='string'&&v.length>70)inp=`<textarea data-k="${f}" data-t="s" ${ro?'disabled':''}>${esc(v)}</textarea>`;
  else inp=`<input data-k="${f}" data-t="s" data-nl="${v==null?1:''}" value="${esc(v??'')}" ${ro?'disabled':''}>`;
  const up=IMG.test(f)&&!ro?`<button class="btn" type="button" onclick="up('${f}')">Upload</button>`:'';
  h+=`<div class="f"><label>${esc(f)}</label><div class="row">${inp}${up}</div></div>`});
 if(r&&c.kids){const k=await sb.from(c.kids).select('*').eq(c.fk,r[pk]);h+=`<h2 style="margin-top:20px">Items</h2>`+(k.data&&k.data.length?`<div class="tw"><table><tbody>${k.data.map(x=>`<tr><td>${Object.entries(x).filter(([a])=>!/^(id|order_id|created_at)$/.test(a)).map(([a,b])=>`${esc(a)}: ${esc(typeof b==='object'?JSON.stringify(b):b)}`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="m">'+(k.error?esc(k.error.message):'No items')+'</p>')}
 if(r&&S.k==='orders'){const l=await sb.from('audit_log').select('*').eq('tbl','orders').eq('record_id',String(r[pk])).order('created_at',{ascending:false}).limit(20);h+='<h2 style="margin-top:20px">Timeline</h2>'+((l.data||[]).map(e=>`<div class="m">${esc((e.created_at||'').slice(0,16).replace('T',' '))} · ${esc(e.action)} ${esc(JSON.stringify(e.details||''))}</div>`).join('')||'<p class="m">No events yet</p>')}
 h+=`<div class="ft">${r&&!c.ro?`<button class="btn d" onclick="del(${i})">Delete</button>`:''}<span class="sp"></span><button class="btn" onclick="mc()">Close</button>${c.ro?'':`<button class="btn p" onclick="save(${i})">Save</button>`}</div>`;
 $('#md').innerHTML=h;$('#mb').style.display='flex'}
function mc(){$('#mb').style.display='none'}
async function save(i){const {c,rows}=S,pk=c.pk||'id',r=i>=0?rows[i]:null;let o={};
 const raw=$('#raw');if(raw){try{o=JSON.parse(raw.value)}catch(e){return toast('Invalid JSON',1)}}
 else for(const el of $$('#md [data-k]')){const k=el.dataset.k,t=el.dataset.t;let v=el.value;
  if(t==='b')v=v==='true';else if(t==='n')v=v===''?null:Number(v);else if(t==='j'){try{v=v.trim()?JSON.parse(v):null}catch(e){return toast(k+': invalid JSON',1)}}else if(v===''&&el.dataset.nl)v=null;
  if(el.disabled)continue;
  if(r){if(JSON.stringify(v)===JSON.stringify(r[k]??null))continue}else if(v===''||v===null)continue;o[k]=v}
 let q;if(r){if(!Object.keys(o).length){mc();return}q=sb.from(c.table).update(o).eq(pk,r[pk]).select()}else q=sb.from(c.table).insert(o).select();
 const {data,error}=await q;if(error)return toast(error.message,1);if(!data||!data.length)return toast('Blocked by RLS: no row changed',1);
 log(r?'update':'insert',c.table,data[0][pk],o);toast('Saved');mc();grid(S.k)}
async function del(i){const {c,rows}=S,pk=c.pk||'id';if(!confirm('Delete this record permanently?'))return;
 const {data,error}=await sb.from(c.table).delete().eq(pk,rows[i][pk]).select();if(error)return toast(error.message,1);if(!data||!data.length)return toast('Blocked by RLS: nothing deleted',1);log('delete',c.table,rows[i][pk],null);toast('Deleted');mc();grid(S.k)}
async function up(f){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const file=i.files[0];if(!file)return;
 const p=Date.now()+'-'+file.name.replace(/[^\w.\-]/g,'_');const {error}=await sb.storage.from('product-images').upload(p,file,{upsert:false});if(error)return toast(error.message,1);
 const url=sb.storage.from('product-images').getPublicUrl(p).data.publicUrl,el=$(`#md [data-k="${f}"]`);
 if(el.dataset.t==='j'){let a=[];try{a=JSON.parse(el.value||'[]');if(!Array.isArray(a))a=[a]}catch(e){}a.push(url);el.value=JSON.stringify(a,null,1)}else el.value=url;toast('Uploaded · now press Save')};i.click()}

/* DASHBOARD + ANALYTICS */
async function dashboard(){main.innerHTML='<p class="m">Loading…</p>';
 const cnt=async t=>{const r=await sb.from(t).select('*',{count:'exact',head:true});return r.error?'—':r.count};
 const [o,pr,w,n,cu]=await Promise.all([list(T.orders),cnt('products'),cnt('waitlist'),cnt('newsletter'),cnt('customer_profiles')]);
 const pp=(await sb.from('products').select('*').limit(2000)).data||[];const rows=o.data||[],td=new Date().toISOString().slice(0,10),today=rows.filter(r=>(r.created_at||'').slice(0,10)===td);
 const by=s=>rows.filter(r=>String(r.status||'').toLowerCase()===s).length;
 const C=(l,v,r)=>`<div class="card"><div class="m">${l}</div><div class="n ${r?'r':''}">${v}</div></div>`;
 main.innerHTML=head('Dashboard',`<button class="btn" onclick="go('products');setTimeout(()=>edit(-1),600)">+ Product</button><button class="btn" onclick="go('orders')">Orders</button>`)+(o.error?`<div class="err" style="margin-bottom:14px">Orders: ${esc(o.error.message)}</div>`:'')+
 `<h2>Today</h2><div class="grid">${C('Orders',today.length)}${C('Sales',inr(today.filter(r=>!bad(r.status)).reduce((a,r)=>a+amt(r),0)),1)}${C('Waitlist total',w)}${C('Customers',cu)}</div>
 <h2>Order status</h2><div class="grid">${C('New',by('new')+by('pending')+by('placed'),1)}${C('Processing',by('processing'))}${C('Packed',by('packed'))}${C('Shipped',by('shipped'))}${C('Delivered',by('delivered'))}${C('Cancelled',by('cancelled'))}</div>
 <h2>Inventory alerts</h2><div class="grid">${C('Out of stock',pp.filter(p=>stk(p)<=0).length,1)}${C('Low stock',pp.filter(p=>stk(p)>0&&stk(p)<=(Number(p.low_stock_threshold)||5)).length)}</div><h2>Catalogue</h2><div class="grid">${C('Products',pr)}${C('Newsletter',n)}${C('All orders',rows.length)}</div>
 <h2>Recent orders</h2>${rows.slice(0,8).map(r=>`<div class="card" style="margin-bottom:6px;display:flex;gap:12px"><span>#${esc(r.order_number||r.id)}</span><span class="m">${esc(r.customer_name||r.name||r.email||'')}</span><span class="sp"></span><span>${
