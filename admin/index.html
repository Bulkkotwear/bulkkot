<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BULKKOT (불꽃) — Site CMS & Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-black: #050505;
      --card-bg: #0d0d0d;
      --border-color: #1f1f1f;
      --text-white: #ffffff;
      --text-muted: #888888;
      --bk-red: #e31b23;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-black); color: var(--text-white); padding: 30px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 30px;
    }
    .header-bar h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .header-actions { display: flex; gap: 12px; }

    .btn {
      padding: 10px 18px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .btn-outline { background: transparent; border-color: var(--border-color); color: #fff; }
    .btn-outline:hover { background: #141414; }
    .btn-primary { background: var(--bk-red); color: #fff; }
    .btn-primary:hover { background: #ff2a33; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .cms-title-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    .cms-title-area h2 { font-size: 20px; font-weight: 800; }
    .cms-title-area p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .cms-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .cms-card-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #181818;
    }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: #000;
      border: 1px solid #222;
      color: #fff;
      padding: 10px 12px;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #555;
    }

    .color-picker-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-picker-box input[type="color"] {
      width: 44px;
      height: 38px;
      padding: 2px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: pointer;
    }
    .color-picker-box input[type="text"] {
      flex: 1;
      font-family: monospace;
      text-transform: uppercase;
    }

    .banner-preview-box {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }
    .banner-preview-box img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .ann-preview-tray {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 4px;
      overflow: hidden;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #fff;
      color: #000;
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 4px;
      display: none;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header-bar">
      <h1>Site CMS</h1>
      <div class="header-actions">
        <button type="button" class="btn btn-outline" onclick="loadAllCMSData()">↻ Refresh</button>
        <a href="/" target="_blank" class="btn btn-outline">Storefront ↗</a>
      </div>
    </header>

    <div class="cms-title-area">
      <div>
        <h2>Site Content & Media CMS</h2>
        <p>Override storefront copy, announcement tickers, typography and visuals live.</p>
      </div>
      <button type="button" class="btn btn-primary" id="saveTopBtn" onclick="saveCMSForm()">SAVE ALL CMS CHANGES</button>
    </div>

    <form id="cmsForm">
      <!-- HERO SECTION -->
      <div class="cms-card">
        <div class="cms-card-title">Hero Campaign & Banner</div>
        <div class="form-group">
          <label>Hero Banner Photo</label>
          <div class="banner-preview-box">
            <img id="hero_img_preview" src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png" alt="Hero">
            <div style="flex: 1;">
              <input type="file" id="hero_file_input" accept="image/*" style="margin-bottom: 8px; font-size: 11px;">
              <input type="text" name="hero_img" id="hero_img_input" placeholder="Banner Image URL">
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Hero Korean Eyebrow</label>
            <input type="text" name="hero_korean" id="hero_korean" value="불꽃">
          </div>
          <div class="form-group">
            <label>Hero Main Brand Title</label>
            <input type="text" name="hero_title" id="hero_title" value="BULKKOT">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Hero Subtitle</label>
            <input type="text" name="hero_sub" id="hero_sub" value="PREMIUM EVERYDAY WEAR">
          </div>
          <div class="form-group">
            <label>Button Text</label>
            <input type="text" name="hero_btn" id="hero_btn" value="EXPLORE DROP 001">
          </div>
        </div>

        <div class="form-group">
          <label>Hero Lead Description</label>
          <textarea name="hero_desc" id="hero_desc" rows="2">Korean-inspired minimalist heavyweight essentials.</textarea>
        </div>
      </div>

      <!-- ANNOUNCEMENT BAR CONTROLLER -->
      <div class="cms-card">
        <div class="cms-card-title">Announcement Ticker</div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Ticker Message 1</label>
            <input type="text" name="announcement_1" id="ann_text1" value="DROP 001 — THIS MONTH">
          </div>
          <div class="form-group">
            <label>Ticker Message 2</label>
            <input type="text" name="announcement_2" id="ann_text2" value="불꽃 DROP 001 — COMING SOON">
          </div>
        </div>

        <div class="form-group">
          <label>Ticker Message 3</label>
          <input type="text" name="announcement_3" id="ann_text3" value="JOIN THE VIP WAITLIST">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Background Color</label>
            <div class="color-picker-box">
              <input type="color" id="ann_bg_pick" value="#e31b23">
              <input type="text" name="announcement_bg" id="ann_bg_val" value="#e31b23">
            </div>
          </div>
          <div class="form-group">
            <label>Text Color</label>
            <div class="color-picker-box">
              <input type="color" id="ann_color_pick" value="#ffffff">
              <input type="text" name="announcement_color" id="ann_color_val" value="#ffffff">
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Font Family</label>
            <select name="announcement_font" id="ann_font_val">
              <option value="'Inter', sans-serif">Inter (Minimalist Modern)</option>
              <option value="'Montserrat', sans-serif">Montserrat (Streetwear Bold)</option>
              <option value="'Noto Sans KR', sans-serif">Noto Sans KR (Korean Vibe)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ticker Speed (Seconds)</label>
            <input type="number" name="announcement_speed" id="ann_speed_val" value="20" min="6" max="60">
          </div>
        </div>

        <div class="form-group">
          <label>Live Interactive Preview</label>
          <div id="ann_preview_box" class="ann-preview-tray" style="background: #e31b23; color: #ffffff; font-family: 'Inter', sans-serif;">
            <span id="ann_preview_text">DROP 001 — THIS MONTH &nbsp;•&nbsp; 불꽃 DROP 001 — COMING SOON &nbsp;•&nbsp; JOIN THE VIP WAITLIST</span>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div id="cmsToast" class="toast"></div>

  <script>
    const SUPABASE_URL = "https://pgubjluqgqvrybvehzeh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBndWJqbHVxZ3F2cnlidmVoemVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzg2NjEsImV4cCI6MjA1NTc1NDY2MX0.g9dK_k660u1dM9eMhGvY61fC8w-aMhV19fN3yZ5k7l8";
    const BUCKET_NAME = "product-media";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showToast(msg, isError = false) {
      const t = document.getElementById('cmsToast');
      t.textContent = msg;
      t.style.background = isError ? "#e31b23" : "#ffffff";
      t.style.color = isError ? "#ffffff" : "#000000";
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    async function loadAllCMSData() {
      showToast("Loading CMS data...");
      try {
        const { data, error } = await supabase.from('site_content').select('*');
        if (error) throw error;

        if (data && data.length > 0) {
          data.forEach(item => {
            const k = item.content_key || item.key;
            const v = item.content_value ?? item.value ?? "";
            const el = document.querySelector(`[name="${k}"]`);
            if (el) el.value = v;

            if (k === 'announcement_bg') {
              document.getElementById('ann_bg_pick').value = v;
            }
            if (k === 'announcement_color') {
              document.getElementById('ann_color_pick').value = v;
            }
            if (k === 'hero_img') {
              document.getElementById('hero_img_preview').src = v;
            }
          });
        }
        updateAnnouncementPreview();
        showToast("CMS Loaded.");
      } catch (err) {
        showToast("Using default values.", false);
        updateAnnouncementPreview();
      }
    }

    function updateAnnouncementPreview() {
      const bg = document.getElementById('ann_bg_val').value;
      const tc = document.getElementById('ann_color_val').value;
      const font = document.getElementById('ann_font_val').value;
      const t1 = document.getElementById('ann_text1').value;
      const t2 = document.getElementById('ann_text2').value;
      const t3 = document.getElementById('ann_text3').value;

      const pBox = document.getElementById('ann_preview_box');
      const pText = document.getElementById('ann_preview_text');

      if (pBox) {
        pBox.style.backgroundColor = bg;
        pBox.style.color = tc;
        pBox.style.fontFamily = font;
      }
      if (pText) {
        pText.innerHTML = `${t1} &nbsp;•&nbsp; ${t2} &nbsp;•&nbsp; ${t3}`;
      }
    }

    ['ann_text1', 'ann_text2', 'ann_text3', 'ann_bg_val', 'ann_color_val', 'ann_font_val'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', updateAnnouncementPreview);
    });

    document.getElementById('ann_bg_pick')?.addEventListener('input', (e) => {
      document.getElementById('ann_bg_val').value = e.target.value;
      updateAnnouncementPreview();
    });

    document.getElementById('ann_color_pick')?.addEventListener('input', (e) => {
      document.getElementById('ann_color_val').value = e.target.value;
      updateAnnouncementPreview();
    });

    document.getElementById('hero_img_input')?.addEventListener('input', (e) => {
      document.getElementById('hero_img_preview').src = e.target.value;
    });

    document.getElementById('hero_file_input')?.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      showToast("Uploading Hero Image...");
      const fileExt = file.name.split('.').pop();
      const fileName = `hero-banner-${Date.now()}.${fileExt}`;
      const filePath = `site-assets/${fileName}`;

      const { error } = await supabase.storage.from(BUCKET_NAME).upload(filePath, file);
      if (error) {
        showToast(`Upload failed: ${error.message}`, true);
      } else {
        const { data: { publicUrl } } = supabase.storage.from(BUCKET_NAME).getPublicUrl(filePath);
        document.getElementById('hero_img_input').value = publicUrl;
        document.getElementById('hero_img_preview').src = publicUrl;
        showToast("Hero Banner Uploaded.");
      }
    });

    async function saveCMSForm() {
      const saveBtn = document.getElementById('saveTopBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = "SAVING...";

      const form = document.getElementById('cmsForm');
      const formData = new FormData(form);
      const updates = [];

      for (const [key, value] of formData.entries()) {
        updates.push(
          supabase.from('site_content').upsert(
            { content_key: key, content_value: value, updated_at: new Date().toISOString() },
            { onConflict: 'content_key' }
          )
        );
      }

      try {
        await Promise.all(updates);
        showToast("All CMS Changes Saved & Synced Live!");
      } catch (err) {
        showToast(`Failed: ${err.message}`, true);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "SAVE ALL CMS CHANGES";
      }
    }

    loadAllCMSData();
  </script>
</body>
</html>
