<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>PRODUCT DETAILS — BULKKOT (불꽃)</title>

  <meta
    name="description"
    content="Korean-inspired premium everyday wear from BULKKOT."
  >

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BULKKOT (불꽃)">
  <meta
    property="og:title"
    content="Product Details — BULKKOT (불꽃)"
    id="ogTitleMeta"
  >
  <meta
    property="og:description"
    content="Korean-inspired premium everyday wear from BULKKOT."
    id="ogDescMeta"
  >
  <meta
    property="og:url"
    content="https://bulkkot.com/product.html"
    id="ogUrlMeta"
  >
  <meta
    property="og:image"
    content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png"
    id="ogImageMeta"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >
  <meta
    name="twitter:title"
    content="Product Details — BULKKOT (불꽃)"
    id="twTitleMeta"
  >
  <meta
    name="twitter:description"
    content="Korean-inspired premium everyday wear from BULKKOT."
    id="twDescMeta"
  >
  <meta
    name="twitter:image"
    content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png"
    id="twImageMeta"
  >

  <link
    rel="icon"
    href="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       BULKKOT PDP
       Production hardening only.
       Visual identity intentionally preserved.
       ========================================================= */

    :root {
      --pdp-bg: #070707;
      --pdp-card: #0e0e0e;
      --pdp-surface: #111;
      --pdp-border: #1a1a1a;
      --pdp-border-strong: #292929;
      --pdp-text: #f5f5f5;
      --pdp-muted: #888;
      --pdp-red: var(--bk-red, #e31b23);
      --pdp-green: #31c48d;
    }

    html {
      overflow-x: clip;
      background: var(--pdp-bg);
    }

    body {
      margin: 0;
      background: var(--pdp-bg);
      color: var(--pdp-text);
      font-family: "Inter", sans-serif;
      overflow-x: clip;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 2px;
    }

    /* =========================================================
       WRAPPER
       ========================================================= */

    .pdp-wrapper {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 24px 20px 80px;
      box-sizing: border-box;
    }

    /* =========================================================
       BREADCRUMB
       ========================================================= */

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      margin-bottom: 24px;
      overflow: hidden;
      color: #888;
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .breadcrumb a {
      flex: 0 0 auto;
      color: #888;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: #fff;
    }

    #breadName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       MAIN PDP GRID
       ========================================================= */

    .pdp-main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 50px;
      align-items: start;
      min-width: 0;
    }

    .pdp-gallery-column,
    .pdp-info-column {
      min-width: 0;
    }

    /* =========================================================
       GALLERY
       ========================================================= */

    .pdp-gallery-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--pdp-card);
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      aspect-ratio: 1 / 1.08;
    }

    .pdp-gallery-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pdp-gallery-box img.image-failed {
      object-fit: contain;
      padding: 32px;
      box-sizing: border-box;
      opacity: 0.65;
    }

    .pdp-gallery-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          100deg,
          #101010 30%,
          #191919 50%,
          #101010 70%
        );
      background-size: 200% 100%;
      animation: pdpShimmer 1.4s infinite;
    }

    .pdp-gallery-loading[hidden] {
      display: none;
    }

    .pdp-thumb-strip {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
      padding-bottom: 3px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }

    .pdp-thumb-strip::-webkit-scrollbar {
      display: none;
    }

    .pdp-thumb {
      position: relative;
      flex: 0 0 64px;
      width: 64px;
      height: 64px;
      padding: 0;
      overflow: hidden;
      border: 1px solid #242424;
      border-radius: 4px;
      background: #111;
      opacity: 0.6;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        opacity 0.15s ease;
    }

    .pdp-thumb:hover,
    .pdp-thumb.active {
      border-color: #fff;
      opacity: 1;
    }

    .pdp-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================================
       PRODUCT META
       ========================================================= */

    .pdp-meta-kicker {
      display: block;
      margin-bottom: 6px;
      color: var(--pdp-red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .pdp-meta-title {
      margin: 0 0 10px;
      color: #f5f5f5;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.01em;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .pdp-meta-price {
      margin-bottom: 18px;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
    }

    .pdp-desc {
      margin: 0 0 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1a1a1a;
      color: #999;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-line;
    }

    /* =========================================================
       SIZE SELECTOR
       ========================================================= */

    .opt-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #bbb;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1.4;
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-width: 300px;
      margin-bottom: 24px;
    }

    .size-box {
      position: relative;
      min-width: 0;
      min-height: 44px;
      padding: 8px;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #111;
      color: #ddd;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    .size-box:hover:not(:disabled),
    .size-box.active {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .size-box:disabled {
      color: #555;
      opacity: 0.5;
      cursor: not-allowed;
    }

    .size-box:disabled::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      border-top: 1px solid #555;
    }

    /* =========================================================
       CTA
       ========================================================= */

    .cta-row {
      display: flex;
      width: 100%;
      gap: 12px;
      margin-bottom: 30px;
    }

    .btn-add-bag {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border: 0;
      border-radius: 4px;
      background: var(--pdp-red);
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1.2;
      transition:
        opacity 0.2s ease,
        background-color 0.2s ease;
    }

    .btn-add-bag:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-add-bag:disabled {
      background: #2a2a2a;
      color: #777;
      cursor: not-allowed;
    }

    /* =========================================================
       FEATURE LIST
       ========================================================= */

    .feature-list {
      padding: 16px;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      background: #0d0d0d;
      color: #888;
      font-size: 11px;
      line-height: 1.8;
    }

    .feature-list div + div {
      margin-top: 2px;
    }

    /* =========================================================
       SIMILAR
       ========================================================= */

    .similar-sec {
      margin-top: 80px;
      padding-top: 40px;
      border-top: 1px solid #1a1a1a;
    }

    .similar-heading {
      margin: 0;
      color: #f5f5f5;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .similar-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
      min-width: 0;
    }

    .similar-card {
      display: block;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      background: #0e0e0e;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s ease;
    }

    .similar-card:hover {
      border-color: #333;
    }

    .similar-card-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1.12;
      object-fit: cover;
      background: #141414;
    }

    .similar-card-image.image-failed {
      object-fit: contain;
      padding: 20px;
      box-sizing: border-box;
      opacity: 0.65;
    }

    .similar-card-info {
      min-width: 0;
      padding: 10px;
    }

    .similar-card-name {
      margin: 0 0 4px;
      overflow: hidden;
      color: #eee;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .similar-card-price {
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    /* =========================================================
       LOADING / NOT FOUND
       ========================================================= */

    .pdp-loading-grid {
      min-width: 0;
    }

    .pdp-skel {
      background:
        linear-gradient(
          100deg,
          #141414 30%,
          #1c1c1c 50%,
          #141414 70%
        );
      background-size: 200% 100%;
      animation: pdpShimmer 1.4s infinite;
      border-radius: 4px;
    }

    .pdp-loading-gallery {
      width: 100%;
      aspect-ratio: 1 / 1.08;
    }

    .pdp-loading-line {
      height: 12px;
      margin-bottom: 12px;
    }

    .pdp-loading-line.wide {
      width: 80%;
    }

    .pdp-loading-line.medium {
      width: 50%;
    }

    .pdp-loading-line.small {
      width: 30%;
    }

    @keyframes pdpShimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    .pdp-not-found {
      box-sizing: border-box;
      width: 100%;
      padding: 100px 20px;
      color: #888;
      text-align: center;
    }

    .pdp-not-found strong {
      display: block;
      margin-bottom: 10px;
      color: #fff;
      font-size: 18px;
      line-height: 1.3;
    }

    .pdp-not-found p {
      margin: 0 0 20px;
      font-size: 12px;
      line-height: 1.6;
    }

    .pdp-not-found a {
      color: var(--pdp-red);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 900px) {
      .pdp-main-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
      }

      .pdp-gallery-box {
        max-width: 720px;
        margin: 0 auto;
      }

      .pdp-info-column {
        width: min(720px, 100%);
        margin: 0 auto;
      }

      .similar-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {
      .pdp-wrapper {
        padding: 16px 12px 64px;
      }

      .breadcrumb {
        margin-bottom: 16px;
        font-size: 10px;
      }

      .pdp-main-grid {
        gap: 22px;
      }

      .pdp-gallery-box {
        border-radius: 6px;
        aspect-ratio: 1 / 1.08;
      }

      .pdp-thumb {
        flex-basis: 58px;
        width: 58px;
        height: 58px;
      }

      .pdp-meta-kicker {
        font-size: 9px;
      }

      .pdp-meta-title {
        font-size: 22px;
      }

      .pdp-meta-price {
        font-size: 20px;
        margin-bottom: 14px;
      }

      .pdp-desc {
        font-size: 12px;
        margin-bottom: 20px;
        padding-bottom: 18px;
      }

      .opt-label {
        font-size: 10px;
      }

      .size-grid {
        width: 100%;
        max-width: 100%;
        gap: 7px;
      }

      .size-box {
        min-height: 46px;
      }

      .cta-row {
        margin-bottom: 22px;
      }

      .btn-add-bag {
        min-height: 52px;
      }

      .feature-list {
        padding: 14px;
        font-size: 10px;
      }

      .similar-sec {
        margin-top: 56px;
        padding-top: 28px;
      }

      .similar-heading {
        font-size: 14px;
      }

      .similar-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    }

    /* =========================================================
       COMPACT 360–374PX
       ========================================================= */

    @media (max-width: 374px) {
      .pdp-wrapper {
        padding-left: 10px;
        padding-right: 10px;
      }

      .pdp-meta-title {
        font-size: 20px;
      }

      .pdp-meta-price {
        font-size: 19px;
      }

      .size-grid {
        gap: 6px;
      }

      .size-box {
        min-height: 44px;
        font-size: 11px;
      }

      .feature-list {
        font-size: 9px;
      }

      .similar-grid {
        gap: 8px;
      }

      .similar-card-info {
        padding: 9px;
      }

      .similar-card-name {
        font-size: 10px;
      }

      .similar-card-price {
        font-size: 11px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      .pdp-skel,
      .pdp-gallery-loading,
      .pdp-thumb,
      .size-box,
      .btn-add-bag,
      .similar-card {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="site-header">
    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="BULKKOT home"
        style="display:flex; align-items:center; gap:10px; text-decoration:none;"
      >
        <img
          src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png"
          alt="BULKKOT logo"
          class="brand-logo"
          width="36"
          height="36"
          style="width:36px; height:36px;"
        >

        <span class="brand-name">
          <span
            class="brand-korean"
            style="color:var(--bk-red, #e31b23); font-weight:700;"
          >불꽃</span>

          <span
            class="brand-english"
            style="color:#fff; font-weight:900;"
          >BULKKOT</span>
        </span>
      </a>

      <div class="header-actions">

        <a
          href="shop.html"
          class="nav-btn"
          style="color:#aaa; font-size:11px; font-weight:700; text-decoration:none;"
        >← BACK TO CATALOG</a>

        <button
          type="button"
          class="header-action cart-action"
          data-open-cart
          aria-label="Open cart"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M4 5h2l1.7 11h9.8L20 8H7"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="17" cy="20" r="1"></circle>
          </svg>

          <span
            class="cart-count"
            data-cart-count
            hidden
          >0</span>
        </button>

      </div>
    </div>
  </header>

  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="pdp-wrapper">

    <div class="breadcrumb">
      <a href="index.html">HOME</a>
      <span>/</span>
      <a href="shop.html">SHOP</a>
      <span>/</span>
      <span
        id="breadName"
        style="color:#fff;"
      >SILHOUETTE</span>
    </div>

    <!-- Initial loading skeleton -->
    <div
      id="pdpLoading"
      class="pdp-main-grid"
      aria-hidden="true"
    >
      <div class="pdp-loading-grid">
        <div class="pdp-skel pdp-loading-gallery"></div>
      </div>

      <div>
        <div
          class="pdp-skel pdp-loading-line small"
          style="margin-top:8px;"
        ></div>

        <div
          class="pdp-skel pdp-loading-line wide"
          style="height:28px;"
        ></div>

        <div
          class="pdp-skel pdp-loading-line medium"
          style="height:22px;"
        ></div>

        <div
          class="pdp-skel pdp-loading-line wide"
          style="margin-top:28px;"
        ></div>

        <div
          class="pdp-skel pdp-loading-line wide"
        ></div>

        <div
          class="pdp-skel pdp-loading-line medium"
        ></div>
      </div>
    </div>

    <div
      class="pdp-main-grid"
      id="pdpContent"
      hidden
    >

      <!-- ===================================================
           GALLERY
           =================================================== -->

      <div class="pdp-gallery-column">

        <div class="pdp-gallery-box">

          <div
            class="pdp-gallery-loading"
            id="galleryLoading"
            aria-hidden="true"
          ></div>

          <img
            id="pdpImg"
            src=""
            alt="Product silhouette"
            width="800"
            height="864"
          >

        </div>

        <div
          class="pdp-thumb-strip"
          id="pdpThumbStrip"
          aria-label="Product images"
        ></div>

      </div>

      <!-- ===================================================
           DETAILS
           =================================================== -->

      <div class="pdp-info-column">

        <span
          class="pdp-meta-kicker"
          id="pdpKicker"
        >BULKKOT ESSENTIAL</span>

        <h1
          class="pdp-meta-title"
          id="pdpTitle"
        >LOADING...</h1>

        <div
          class="pdp-meta-price"
          id="pdpPrice"
        >₹0</div>

        <p
          class="pdp-desc"
          id="pdpDesc"
        ></p>

        <!-- SIZE -->
        <div class="opt-label">
          <span>SELECT SIZE (UK/INDIA)</span>

          <span
            id="pdpStockStatus"
            style="color:var(--pdp-green);"
          >IN STOCK</span>
        </div>

        <div
          class="size-grid"
          id="pdpSizeGrid"
          role="group"
          aria-label="Select product size"
        >
          <button
            type="button"
            class="size-box"
            data-size="S"
            aria-label="Size S"
          >S</button>

          <button
            type="button"
            class="size-box"
            data-size="M"
            aria-label="Size M"
          >M</button>

          <button
            type="button"
            class="size-box"
            data-size="L"
            aria-label="Size L"
          >L</button>

          <button
            type="button"
            class="size-box"
            data-size="XL"
            aria-label="Size XL"
          >XL</button>
        </div>

        <p
          id="pdpSizePrompt"
          class="pdp-size-prompt"
          hidden
          role="alert"
          aria-live="polite"
        ></p>

        <!-- CTA -->
        <div class="cta-row">
          <button
            type="button"
            class="btn-add-bag"
            id="pdpAddBtn"
            disabled
          >LOADING...</button>
        </div>

        <!-- FEATURES -->
        <div
          class="feature-list"
          id="pdpFeatureList"
        ></div>

      </div>

    </div>

    <!-- =====================================================
         SIMILAR PRODUCTS
         ===================================================== -->

    <section
      class="similar-sec"
      id="similarSec"
      hidden
    >
      <h2 class="similar-heading">
        SIMILAR SILHOUETTES
      </h2>

      <div
        class="similar-grid"
        id="similarGrid"
      ></div>
    </section>

  </main>

  <!-- =======================================================
       CART
       ======================================================= -->

  <div
    class="drawer-overlay"
    data-cart-overlay
  ></div>

  <aside
    class="cart-drawer"
    id="cart-drawer"
    data-cart-drawer
    aria-hidden="true"
  ></aside>

  <script src="js/cart.js"></script>

  <script>
    (() => {
      "use strict";

      /* =====================================================
         CONFIG
         ===================================================== */

      const SUPABASE_URL =
        "https://pgubjluqgqvrybvehzeh.supabase.co";

      const SUPABASE_ANON_KEY =
        "sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP";

      const FALLBACK_IMG =
        "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png";

      const SIZES = ["S", "M", "L", "XL"];

      const supabaseClient =
        window.supabase &&
        typeof window.supabase.createClient === "function"
          ? window.supabase.createClient(
              SUPABASE_URL,
              SUPABASE_ANON_KEY
            )
          : null;

      /* =====================================================
         DOM
         ===================================================== */

      const loadingEl =
        document.getElementById("pdpLoading");

      const contentEl =
        document.getElementById("pdpContent");

      const similarSec =
        document.getElementById("similarSec");

      const similarGrid =
        document.getElementById("similarGrid");

      const galleryLoading =
        document.getElementById("galleryLoading");

      const mainImage =
        document.getElementById("pdpImg");

      const thumbStrip =
        document.getElementById("pdpThumbStrip");

      const titleEl =
        document.getElementById("pdpTitle");

      const priceEl =
        document.getElementById("pdpPrice");

      const kickerEl =
        document.getElementById("pdpKicker");

      const descEl =
        document.getElementById("pdpDesc");

      const breadName =
        document.getElementById("breadName");

      const stockStatus =
        document.getElementById("pdpStockStatus");

      const sizeGrid =
        document.getElementById("pdpSizeGrid");

      const addBtn =
        document.getElementById("pdpAddBtn");

      /* =====================================================
         STATE
         ===================================================== */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const productId =
        params.get("id");

      let product = null;
      let selectedSize = null;
      let activeImageIndex = 0;

      /* =====================================================
         HELPERS
         ===================================================== */

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          })[char]
        );
      }

      function formatPrice(value) {
        return `₹${Number(
          value || 0
        ).toLocaleString("en-IN")}`;
      }

      function getImages(item) {
        if (
          Array.isArray(item?.images)
        ) {
          const valid =
            item.images.filter(
              (src) =>
                typeof src === "string" &&
                src.trim()
            );

          if (valid.length) {
            return valid;
          }
        }

        if (
          typeof item?.image_url === "string" &&
          item.image_url.trim()
        ) {
          return [
            item.image_url.trim()
          ];
        }

        return [FALLBACK_IMG];
      }

      function getStock(item) {
        if (
          item?.stock &&
          typeof item.stock === "object" &&
          !Array.isArray(item.stock)
        ) {
          return item.stock;
        }

        return {};
      }

      function getAvailableSizes(item) {
        const stock =
          getStock(item);

        return SIZES.filter(
          (size) =>
            Number(
              stock[size] || 0
            ) > 0
        );
      }

      function isSoldOut(item) {
        return (
          getAvailableSizes(item)
            .length === 0
        );
      }

      function getFirstAvailableSize(item) {
        return (
          getAvailableSizes(item)[0] ||
          null
        );
      }

      /* =====================================================
         NOT FOUND / ERROR
         ===================================================== */

      function showNotFound(message) {
        loadingEl.hidden = true;
        contentEl.hidden = false;

        contentEl.innerHTML = `
          <div
            class="pdp-not-found"
            style="grid-column:1 / -1;"
          >
            <strong>
              ${escapeHtml(
                message ||
                "This piece could not be found."
              )}
            </strong>

            <p>
              It may have been removed or
              the product link may be incorrect.
            </p>

            <a href="shop.html">
              ← BACK TO CATALOGUE
            </a>
          </div>
        `;

        similarSec.hidden = true;
      }

      /* =====================================================
         IMAGE FALLBACK
         ===================================================== */

      function applyImageFallback(image) {
        if (!image) return;

        if (
          image.dataset.fallbackApplied ===
          "true"
        ) {
          return;
        }

        image.dataset.fallbackApplied =
          "true";

        image.src = FALLBACK_IMG;
        image.classList.add(
          "image-failed"
        );
      }

      /* =====================================================
         GALLERY
         ===================================================== */

      function renderGallery() {
        const images =
          getImages(product);

        activeImageIndex = 0;

        function setActiveImage(index) {
          if (
            index < 0 ||
            index >= images.length
          ) {
            return;
          }

          activeImageIndex = index;

          mainImage.src =
            images[index];

          mainImage.alt =
            `${product.name || "Product"} — image ${
              index + 1
            }`;

          thumbStrip
            .querySelectorAll(".pdp-thumb")
            .forEach(
              (thumb, thumbIndex) => {
                const active =
                  thumbIndex === index;

                thumb.classList.toggle(
                  "active",
                  active
                );

                thumb.setAttribute(
                  "aria-current",
                  active
                    ? "true"
                    : "false"
                );
              }
            );
        }

        mainImage.dataset.fallbackApplied =
          "false";

        mainImage.classList.remove(
          "image-failed"
        );

        mainImage.onload = () => {
          galleryLoading.hidden = true;
        };

        mainImage.onerror = () => {
          galleryLoading.hidden = true;
          applyImageFallback(
            mainImage
          );
        };

        galleryLoading.hidden = false;

        thumbStrip.innerHTML =
          images.length > 1
            ? images
                .map(
                  (src, index) => `
                    <button
                      type="button"
                      class="pdp-thumb${
                        index === 0
                          ? " active"
                          : ""
                      }"
                      data-image-index="${index}"
                      aria-label="View image ${
                        index + 1
                      }"
                      aria-current="${
                        index === 0
                          ? "true"
                          : "false"
                      }"
                    >
                      <img
                        src="${escapeHtml(
                          src
                        )}"
                        alt=""
                        loading="${
                          index === 0
                            ? "eager"
                            : "lazy"
                        }"
                        decoding="async"
                      >
                    </button>
                  `
                )
                .join("")
            : "";

        thumbStrip
          .querySelectorAll(".pdp-thumb")
          .forEach(
            (thumb) => {
              thumb.addEventListener(
                "click",
                () => {
                  setActiveImage(
                    Number(
                      thumb.dataset
                        .imageIndex
                    )
                  );
                }
              );

              const thumbImage =
                thumb.querySelector("img");

              thumbImage?.addEventListener(
                "error",
                () => {
                  thumbImage.src =
                    FALLBACK_IMG;
                },
                { once: true }
              );
            }
          );

        setActiveImage(0);
      }

      /* =====================================================
         SIZE RENDER
         ===================================================== */

      function renderSizes() {
        const stock =
          getStock(product);

        const available =
          getAvailableSizes(product);

        selectedSize =
          available.includes(
            selectedSize
          )
            ? selectedSize
            : available[0] || null;

        sizeGrid
          .querySelectorAll(".size-box")
          .forEach(
            (button) => {
              const size =
                button.dataset.size;

              const inStock =
                Number(
                  stock[size] || 0
                ) > 0;

              const active =
                selectedSize === size;

              button.disabled =
                !inStock;

              button.classList.toggle(
                "active",
                active
              );

              button.setAttribute(
                "aria-pressed",
                active
                  ? "true"
                  : "false"
              );

              button.setAttribute(
                "aria-label",
                inStock
                  ? `Select size ${size}`
                  : `Size ${size} is sold out`
              );
            }
          );

        const soldOut =
          available.length === 0;

        if (soldOut) {
          stockStatus.textContent =
            "SOLD OUT";

          stockStatus.style.color =
            "var(--pdp-red)";

          addBtn.disabled = true;
          addBtn.textContent =
            "SOLD OUT";
        } else {
          stockStatus.textContent =
            "IN STOCK";

          stockStatus.style.color =
            "var(--pdp-green)";

          addBtn.disabled =
            !selectedSize;

          addBtn.textContent =
            "ADD TO BAG";
        }
      }

      /* =====================================================
         PRODUCT INFO
         ===================================================== */

      function renderProductInfo() {
        const name =
          product.name ||
          "Untitled Garment";

        const description =
          String(
            product.description || ""
          ).trim();

        titleEl.textContent =
          name;

        breadName.textContent =
          name;

        priceEl.textContent =
          formatPrice(
            product.price
          );

        const kickerParts = [
          product.category
            ? String(
                product.category
              ).toUpperCase()
            : null,
          product.gsm
            ? `${product.gsm} GSM`
            : null
        ].filter(Boolean);

        kickerEl.textContent =
          kickerParts.length
            ? kickerParts.join(" · ")
            : "BULKKOT ESSENTIAL";

        if (description) {
          descEl.textContent =
            description;

          descEl.hidden = false;
        } else {
          descEl.hidden = true;
        }

        const features = [];

        if (product.fabric) {
          features.push(
            `✓ ${product.fabric}`
          );
        }

        if (product.fit) {
          features.push(
            `✓ ${product.fit} fit`
          );
        }

        /*
         * Keep existing storefront promises
         * exactly as configured in the current
         * product experience.
         */
        features.push(
          "✓ Free express shipping across India"
        );

        features.push(
          "✓ 7-Day hassle-free size exchange window"
        );

        document.getElementById(
          "pdpFeatureList"
        ).innerHTML =
          features
            .map(
              (feature) =>
                `<div>${escapeHtml(
                  feature
                )}</div>`
            )
            .join("");

        renderGallery();
        renderSizes();

        updateMeta();

        loadingEl.hidden = true;
        contentEl.hidden = false;
      }

      /* =====================================================
         SEO / TAB META
         ===================================================== */

      function updateMeta() {
        const name =
          product.name ||
          "Silhouette";

        const description =
          String(
            product.description ||
              "Korean-inspired premium everyday wear from BULKKOT."
          )
            .trim()
            .slice(0, 160);

        const image =
          getImages(product)[0] ||
          FALLBACK_IMG;

        const canonicalUrl =
          new URL(
            `product.html?id=${encodeURIComponent(
              String(product.id)
            )}`,
            window.location.href
          ).href;

        const pageTitle =
          `${name} — BULKKOT (불꽃)`;

        document.title =
          pageTitle;

        document
          .getElementById("ogTitleMeta")
          ?.setAttribute(
            "content",
            pageTitle
          );

        document
          .getElementById("ogDescMeta")
          ?.setAttribute(
            "content",
            description
          );

        document
          .getElementById("ogImageMeta")
          ?.setAttribute(
            "content",
            image
          );

        document
          .getElementById("ogUrlMeta")
          ?.setAttribute(
            "content",
            canonicalUrl
          );

        document
          .getElementById("twTitleMeta")
          ?.setAttribute(
            "content",
            pageTitle
          );

        document
          .getElementById("twDescMeta")
          ?.setAttribute(
            "content",
            description
          );

        document
          .getElementById("twImageMeta")
          ?.setAttribute(
            "content",
            image
          );
      }

      /* =====================================================
         SIZE EVENTS
         ===================================================== */

      sizeGrid.addEventListener(
        "click",
        (event) => {
          const button =
            event.target.closest(
              ".size-box"
            );

          if (
            !button ||
            button.disabled
          ) {
            return;
          }

          const size =
            button.dataset.size;

          if (
            !SIZES.includes(size)
          ) {
            return;
          }

          const stock =
            getStock(product);

          if (
            Number(
              stock[size] || 0
            ) <= 0
          ) {
            return;
          }

          selectedSize =
            size;

          sizeGrid
            .querySelectorAll(
              ".size-box"
            )
            .forEach(
              (item) => {
                const active =
                  item.dataset.size ===
                  selectedSize;

                item.classList.toggle(
                  "active",
                  active
                );

                item.setAttribute(
                  "aria-pressed",
                  active
                    ? "true"
                    : "false"
                );
              }
            );
        }
      );

      /* =====================================================
         ADD TO CART
         ===================================================== */

      addBtn.addEventListener(
        "click",
        () => {
          if (!product) {
            return;
          }

          if (!selectedSize) {
            const prompt = document.getElementById("pdpSizePrompt");
            if (prompt) {
              prompt.textContent = "SELECT A SIZE TO CONTINUE.";
              prompt.hidden = false;
            }
            return;
          }

          const stock =
            getStock(product);

          if (
            Number(
              stock[selectedSize] || 0
            ) <= 0
          ) {
            renderSizes();
            return;
          }

          const cart =
            window.BULKKOT_CART;

          if (
            !cart ||
            typeof cart.addItem !==
              "function"
          ) {
            console.error(
              "BULKKOT cart engine is unavailable."
            );
            return;
          }

          document.getElementById("pdpSizePrompt")?.setAttribute("hidden", "");

          cart.addItem({
            id: product.id,
            name:
              product.name ||
              "Untitled Garment",
            price:
              Number(
                product.price || 0
              ),
            size:
              selectedSize,
            image:
              getImages(product)[0] ||
              FALLBACK_IMG,
            quantity: 1
          });
        }
      );

      /* =====================================================
         SIMILAR PRODUCTS
         ===================================================== */

      async function loadSimilar() {
        if (
          !supabaseClient ||
          !product?.category
        ) {
          similarSec.hidden = true;
          return;
        }

        try {
          const {
            data,
            error
          } =
            await supabaseClient
              .from("products")
              .select("*")
              .eq(
                "category",
                product.category
              )
              .neq(
                "id",
                product.id
              )
              .order(
                "created_at",
                {
                  ascending: false
                }
              )
              .limit(8);

          if (error) {
            throw error;
          }

          const similar =
            Array.isArray(data)
              ? data
                  .filter(
                    (item) =>
                      item?.active !== false
                  )
                  .slice(0, 4)
              : [];

          if (!similar.length) {
            similarSec.hidden = true;
            return;
          }

          similarGrid.innerHTML =
            similar
              .map(
                (item) => {
                  const image =
                    getImages(
                      item
                    )[0] ||
                    FALLBACK_IMG;

                  return `
                    <a
                      class="similar-card"
                      href="product.html?id=${encodeURIComponent(
                        String(
                          item.id
                        )
                      )}"
                      aria-label="View ${escapeHtml(
                        item.name ||
                        "product"
                      )}"
                    >

                      <img
                        class="similar-card-image"
                        src="${escapeHtml(
                          image
                        )}"
                        alt="${escapeHtml(
                          item.name ||
                          "Product"
                        )}"
                        loading="lazy"
                        decoding="async"
                      >

                      <div class="similar-card-info">

                        <h3 class="similar-card-name">
                          ${escapeHtml(
                            item.name ||
                            "Untitled Garment"
                          )}
                        </h3>

                        <span class="similar-card-price">
                          ${formatPrice(
                            item.price
                          )}
                        </span>

                      </div>

                    </a>
                  `;
                }
              )
              .join("");

          similarGrid
            .querySelectorAll(
              ".similar-card-image"
            )
            .forEach(
              (image) => {
                image.addEventListener(
                  "error",
                  () => {
                    applyImageFallback(
                      image
                    );
                  },
                  { once: true }
                );
              }
            );

          similarSec.hidden = false;
        } catch (error) {
          console.error(
            "BULKKOT similar products failed:",
            error
          );

          similarSec.hidden = true;
        }
      }

      function withTimeout(promise, ms = 12000) {
        let timer = null;

        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => {
            reject(new Error("Product request timed out. Please retry."));
          }, ms);
        });

        return Promise.race([promise, timeout]).finally(() => {
          if (timer) clearTimeout(timer);
        });
      }

      /* =====================================================
         LOAD PRODUCT
         ===================================================== */

      async function loadProduct() {
        if (!productId) {
          showNotFound(
            "No product specified."
          );
          return;
        }

        if (!supabaseClient) {
          showNotFound(
            "Store is currently offline."
          );
          return;
        }

        try {
          const {
            data,
            error
          } =
            await supabaseClient
              .from("products")
              .select("*")
              .eq(
                "id",
                productId
              )
              .maybeSingle();

          if (error) {
            throw error;
          }

          if (
            !data ||
            data.active === false
          ) {
            showNotFound(
              "This piece could not be found."
            );
            return;
          }

          product = data;

          renderProductInfo();

          /*
           * Similar products are intentionally
           * non-blocking. Main PDP becomes usable
           * even if recommendation query fails.
           */
          loadSimilar();

        } catch (error) {
          console.error(
            "BULKKOT product load failed:",
            error
          );

          showNotFound(
            "Something went wrong loading this piece."
          );
        }
      }

      /* =====================================================
         INIT
         ===================================================== */

      loadProduct();

    })();
  </script>

</body>
</html>
