<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SHOP SILHOUETTES — BULKKOT (불꽃)</title>
  <meta name="description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats, Korean-inspired oversized essentials.">
  <meta name="theme-color" content="#070707">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BULKKOT (불꽃)">
  <meta property="og:title" content="Shop Silhouettes — BULKKOT (불꽃)">
  <meta property="og:description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats, Korean-inspired oversized essentials.">
  <meta property="og:url" content="https://bulkkot.com/shop.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png">
  <meta property="og:image:width" content="541">
  <meta property="og:image:height" content="359">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop Silhouettes — BULKKOT (불꽃)">
  <meta name="twitter:description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png">

  <link rel="icon" href="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       BULKKOT SHOP
       Production hardening only.
       Visual identity intentionally preserved.
       ========================================================= */

    :root {
      --shop-bg: #070707;
      --shop-card: #0e0e0e;
      --shop-surface: #121212;
      --shop-border: #1a1a1a;
      --shop-border-strong: #242424;
      --shop-text: #f5f5f5;
      --shop-muted: #888;
      --shop-red: var(--bk-red, #e31b23);
    }

    html {
      overflow-x: clip;
      background: var(--shop-bg);
    }

    body {
      margin: 0;
      background: var(--shop-bg);
      color: var(--shop-text);
      font-family: 'Inter', sans-serif;
      overflow-x: clip;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a,
    input,
    select {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       SHOP CONTAINER
       ========================================================= */

    .shop-container {
      width: min(1360px, 100%);
      margin: 0 auto;
      padding: 24px 16px 80px;
      box-sizing: border-box;
    }

    /* =========================================================
       HEADER / FILTER BAR
       ========================================================= */

    .shop-header-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(180px, 260px) auto;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--shop-border);
      margin-bottom: 24px;
      min-width: 0;
    }

    .shop-title-area {
      min-width: 0;
    }

    .shop-title-area h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .shop-title-area p {
      margin: 5px 0 0;
      color: var(--shop-muted);
      font-size: 10px;
      line-height: 1.3;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .filter-strip {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      padding: 2px 0 4px;
    }

    .filter-strip::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 38px;
      min-width: 44px;
      padding: 8px 16px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      background: var(--shop-surface);
      color: #999;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn:focus-visible,
    .filter-btn.active {
      background: #fff;
      border-color: #fff;
      color: #000;
    }

    .filter-btn:focus-visible,
    .shop-search:focus-visible,
    .shop-sort:focus-visible,
    .p-size-chip:focus-visible,
    .p-quickadd-btn:focus-visible,
    .shop-retry-btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.75);
      outline-offset: 2px;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search-wrap {
      min-width: 0;
      width: 100%;
    }

    .shop-search {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 38px;
      box-sizing: border-box;
      padding: 0 12px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      outline: none;
      background: var(--shop-surface);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .shop-search::placeholder {
      color: #666;
      opacity: 1;
    }

    .shop-search:focus {
      border-color: #444;
    }

    /* =========================================================
       SORT
       ========================================================= */

    .sort-wrap {
      min-width: 0;
    }

    .shop-sort {
      display: block;
      width: 100%;
      min-height: 38px;
      box-sizing: border-box;
      padding: 0 12px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      outline: none;
      background: var(--shop-surface);
      color: #fff;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    /* =========================================================
       PRODUCTS GRID
       ========================================================= */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      width: 100%;
      min-width: 0;
      align-items: stretch;
    }

    .p-card {
      min-width: 0;
      background: var(--shop-card);
      border: 1px solid var(--shop-border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: inherit;
      transition: border-color 0.2s ease;
    }

    .p-card:hover {
      border-color: #333;
    }

    .p-card-link {
      display: block;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       PRODUCT IMAGE
       Stable aspect ratio = no layout shift.
       ========================================================= */

    .p-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.12;
      min-width: 0;
      overflow: hidden;
      background: #141414;
      isolation: isolate;
    }

    .p-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .p-card:hover .p-thumb img {
      transform: scale(1.04);
    }

    .p-thumb.is-sold-out img {
      opacity: 0.45;
      filter: grayscale(0.4);
    }

    .p-thumb img.image-failed {
      object-fit: contain;
      padding: 20px;
      box-sizing: border-box;
      opacity: 0.65;
    }

    .p-tag {
      position: absolute;
      z-index: 2;
      top: 10px;
      left: 10px;
      max-width: calc(100% - 20px);
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 5px 8px;
      border: 1px solid #222;
      background: rgba(0, 0, 0, 0.92);
      color: var(--shop-red);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .p-sold-out-badge {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-align: center;
    }

    /* =========================================================
       PRODUCT INFO
       ========================================================= */

    .p-info {
      min-width: 0;
      padding: 14px;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-sizing: border-box;
    }

    .p-copy {
      min-width: 0;
    }

    .p-info h3 {
      margin: 0 0 4px;
      overflow: hidden;
      color: #eee;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: 0.05em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .p-info .p-sub {
      min-height: 13px;
      margin: 0;
      overflow: hidden;
      color: #777;
      font-size: 10px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .p-meta {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .p-price {
      flex: 0 0 auto;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .p-btn-view {
      display: inline-flex;
      min-height: 32px;
      max-width: 100%;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #333;
      border-radius: 3px;
      color: #ccc;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .p-card:hover .p-btn-view {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    /* =========================================================
       QUICK ADD
       ========================================================= */

    .p-quickadd {
      display: grid;
      grid-template-columns: repeat(4, 1fr) minmax(80px, 1.8fr);
      gap: 6px;
      align-items: center;
      padding: 0 14px 14px;
      min-width: 0;
    }

    .p-size-chip,
    .p-quickadd-btn {
      min-width: 0;
      min-height: 38px;
      box-sizing: border-box;
      border-radius: 3px;
      cursor: pointer;
    }

    .p-size-chip {
      display: grid;
      place-items: center;
      padding: 4px;
      border: 1px solid #2a2a2a;
      background: #111;
      color: #ccc;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
    }

    .p-size-chip:hover:not(:disabled) {
      border-color: #777;
      color: #fff;
    }

    .p-size-chip.active {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .p-size-chip:disabled {
      opacity: 0.3;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .p-quickadd-btn {
      width: 100%;
      padding: 6px 8px;
      border: 0;
      background: var(--shop-red);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.1;
      white-space: nowrap;
    }

    .p-quickadd-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .p-quickadd-btn:disabled {
      background: #2a2a2a;
      color: #777;
      cursor: not-allowed;
    }

    /* =========================================================
       SKELETON
       ========================================================= */

    .p-skeleton {
      min-width: 0;
      overflow: hidden;
      background: var(--shop-card);
      border: 1px solid var(--shop-border);
      border-radius: 6px;
    }

    .p-skeleton .p-thumb {
      aspect-ratio: 1 / 1.12;
      background:
        linear-gradient(
          100deg,
          #141414 30%,
          #1c1c1c 50%,
          #141414 70%
        );
      background-size: 200% 100%;
      animation: shopShimmer 1.4s infinite;
    }

    .p-skeleton .sk-line {
      height: 10px;
      margin: 12px 14px;
      border-radius: 3px;
      background: #161616;
    }

    .p-skeleton .sk-line:last-child {
      margin-top: 0;
    }

    @keyframes shopShimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    /* =========================================================
       EMPTY / ERROR STATES
       ========================================================= */

    .shop-state-msg {
      grid-column: 1 / -1;
      min-width: 0;
      box-sizing: border-box;
      padding: 80px 20px;
      color: #888;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    .shop-state-msg strong {
      display: block;
      margin-bottom: 8px;
      color: #fff;
      font-size: 14px;
      line-height: 1.3;
    }

    .shop-retry-btn {
      min-width: 44px;
      min-height: 42px;
      margin-top: 14px;
      padding: 8px 18px;
      border: 1px solid #333;
      border-radius: 4px;
      background: transparent;
      color: #ccc;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .shop-retry-btn:hover {
      background: #fff;
      color: #000;
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1100px) {
      .shop-header-bar {
        grid-template-columns: minmax(0, 1fr) minmax(180px, 260px) auto;
      }

      .filter-strip {
        grid-column: 1 / -1;
        grid-row: 2;
        order: 3;
      }

      .search-wrap {
        grid-column: 2;
        grid-row: 1;
      }

      .sort-wrap {
        grid-column: 3;
        grid-row: 1;
      }

      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
    }

    /* =========================================================
       LARGE MOBILE / SMALL TABLET
       ========================================================= */

    @media (max-width: 767px) {
      .shop-container {
        padding: 16px 12px 64px;
      }

      .shop-header-bar {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 12px 0 14px;
        margin-bottom: 16px;
      }

      .shop-title-area {
        width: 100%;
      }

      .shop-title-area h1 {
        font-size: 18px;
      }

      .shop-title-area p {
        font-size: 9px;
      }

      .filter-strip {
        width: 100%;
        order: initial;
        padding-bottom: 3px;
      }

      .filter-btn {
        min-height: 40px;
        padding: 8px 14px;
        font-size: 9px;
      }

      .search-wrap,
      .sort-wrap {
        width: 100%;
      }

      .shop-search,
      .shop-sort {
        min-height: 42px;
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .p-info {
        padding: 10px;
        gap: 10px;
      }

      .p-info h3 {
        font-size: 10px;
      }

      .p-info .p-sub {
        font-size: 9px;
      }

      .p-price {
        font-size: 11px;
      }

      .p-btn-view {
        min-height: 32px;
        padding: 5px 7px;
        font-size: 8px;
      }

      .p-quickadd {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
        padding: 0 10px 10px;
      }

      .p-size-chip {
        min-height: 38px;
      }

      .p-quickadd-btn {
        grid-column: 1 / -1;
        min-height: 40px;
        font-size: 9px;
      }

      .shop-state-msg {
        padding: 64px 16px;
      }
    }

    /* =========================================================
       COMPACT 360–374PX
       ========================================================= */

    @media (max-width: 374px) {
      .shop-container {
        padding-left: 10px;
        padding-right: 10px;
      }

      .products-grid {
        gap: 8px;
      }

      .p-info {
        padding: 9px;
      }

      .p-quickadd {
        gap: 4px;
        padding-left: 9px;
        padding-right: 9px;
        padding-bottom: 9px;
      }

      .p-size-chip {
        min-height: 36px;
        font-size: 8px;
      }

      .p-quickadd-btn {
        min-height: 38px;
        font-size: 8px;
      }

      .p-btn-view {
        padding-left: 5px;
        padding-right: 5px;
        font-size: 7px;
      }
    }

    /* =========================================================
       WIDE DESKTOP
       ========================================================= */

    @media (min-width: 1440px) {
      .shop-container {
        padding-left: 24px;
        padding-right: 24px;
      }

      .products-grid {
        gap: 22px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      .p-card,
      .p-thumb img,
      .filter-btn,
      .p-btn-view {
        transition: none !important;
      }

      .p-skeleton .p-thumb {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="site-header">
    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
        aria-label="BULKKOT home"
        style="display:flex; align-items:center; gap:10px; text-decoration:none;"
      >
        <img
          src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png"
          alt="BULKKOT logo"
          class="brand-logo"
          width="36"
          height="36"
          style="width:36px; height:36px;"
        >

        <span class="brand-name">
          <span
            class="brand-korean"
            style="color:var(--bk-red, #e31b23); font-weight:700;"
          >불꽃</span>

          <span
            class="brand-english"
            style="color:#fff; font-weight:900;"
          >BULKKOT</span>
        </span>
      </a>

      <div class="header-actions">

        <a
          href="index.html#top"
          class="nav-btn"
          style="color:#aaa; font-size:11px; font-weight:700; text-decoration:none;"
        >← HOME</a>

        <button
          type="button"
          class="header-action cart-action"
          data-open-cart
          aria-label="Open cart"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M4 5h2l1.7 11h9.8L20 8H7"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="17" cy="20" r="1"></circle>
          </svg>

          <span
            class="cart-count"
            data-cart-count
            hidden
          >0</span>
        </button>

      </div>
    </div>
  </header>

  <!-- =======================================================
       SHOP
       ======================================================= -->

  <main class="shop-container">

    <section
      class="shop-header-bar"
      aria-label="Catalogue controls"
    >

      <div class="shop-title-area">
        <h1 id="shopHeading">CATALOGUE</h1>
        <p id="shopCount">SHOWING SILHOUETTES</p>
      </div>

      <div
        class="filter-strip"
        id="shopFilters"
        role="group"
        aria-label="Filter products by category"
      >
        <button
          type="button"
          class="filter-btn active"
          data-cat="all"
          aria-pressed="true"
        >ALL PIECES</button>

        <button
          type="button"
          class="filter-btn"
          data-cat="tees"
          aria-pressed="false"
        >TEES (티셔츠)</button>

        <button
          type="button"
          class="filter-btn"
          data-cat="hoods"
          aria-pressed="false"
        >HOODIES (후드)</button>

        <button
          type="button"
          class="filter-btn"
          data-cat="sweats"
          aria-pressed="false"
        >SWEATS (스웨트)</button>
      </div>

      <div class="search-wrap">
        <label
          for="shopSearch"
          class="sr-only"
          style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"
        >Search silhouettes</label>

        <input
          type="search"
          id="shopSearch"
          class="shop-search"
          placeholder="SEARCH SILHOUETTES..."
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="search"
        >
      </div>

      <div class="sort-wrap">
        <label
          for="shopSort"
          class="sr-only"
          style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"
        >Sort products</label>

        <select
          id="shopSort"
          class="shop-sort"
          aria-label="Sort products"
        >
          <option value="featured">FEATURED</option>
          <option value="price-low">PRICE: LOW TO HIGH</option>
          <option value="price-high">PRICE: HIGH TO LOW</option>
          <option value="newest">NEWEST</option>
        </select>
      </div>

    </section>

    <section
      class="products-grid"
      id="shopGrid"
      aria-live="polite"
      aria-busy="true"
      aria-label="BULKKOT products"
    ></section>

  </main>

  <!-- =======================================================
       CART DRAWER
       ======================================================= -->

  <div
    class="drawer-overlay"
    data-cart-overlay
  ></div>

  <aside
    class="cart-drawer"
    id="cart-drawer"
    data-cart-drawer
    aria-hidden="true"
  ></aside>

  <!-- =======================================================
       CART ENGINE
       ======================================================= -->

  <script src="js/cart.js"></script>

  <!-- =======================================================
       SHOP ENGINE
       ======================================================= -->

  <script>
    (() => {
      'use strict';

      /* =====================================================
         CONFIG
         ===================================================== */

      const SUPABASE_URL =
        "https://pgubjluqgqvrybvehzeh.supabase.co";

      const SUPABASE_ANON_KEY =
        "sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP";

      const FALLBACK_IMG =
        "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png";

      const SIZES = ["S", "M", "L", "XL"];

      const VALID_CATEGORIES = new Set([
        "all",
        "tees",
        "hoods",
        "sweats"
      ]);

      const VALID_SORTS = new Set([
        "featured",
        "price-low",
        "price-high",
        "newest"
      ]);

      const CATEGORY_LABELS = {
        all: "ALL SILHOUETTES",
        tees: "TEES COLLECTION",
        hoods: "HOODIES COLLECTION",
        sweats: "SWEATS COLLECTION"
      };

      const PARAMS = {
        category: "category",
        search: "q",
        sort: "sort"
      };

      /* =====================================================
         SUPABASE
         ===================================================== */

      const supabaseClient =
        window.supabase &&
        typeof window.supabase.createClient === "function"
          ? window.supabase.createClient(
              SUPABASE_URL,
              SUPABASE_ANON_KEY
            )
          : null;

      /*
       * cart.js also exposes its own client internally.
       * Keeping this page client separate avoids relying on
       * load-order implementation details.
       */

      /* =====================================================
         DOM
         ===================================================== */

      const grid = document.getElementById("shopGrid");
      const heading = document.getElementById("shopHeading");
      const count = document.getElementById("shopCount");
      const searchInput = document.getElementById("shopSearch");
      const sortSelect = document.getElementById("shopSort");
      const filterButtons = Array.from(
        document.querySelectorAll(".filter-btn")
      );

      /* =====================================================
         STATE
         ===================================================== */

      let allProducts = [];
      let selectedCat = "all";
      let searchQuery = "";
      let selectedSort = "featured";

      /*
       * Product ID -> selected size.
       * Kept outside render so changing filters/search/sort
       * does not unexpectedly reset a user's size choice.
       */
      const cardSizeSelection = new Map();

      let searchDebounce = null;
      let isLoading = false;

      /* =====================================================
         UTILITIES
         ===================================================== */

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          })[char]
        );
      }

      function escapeAttribute(value) {
        return escapeHtml(value);
      }

      function normalizeCategory(value) {
        const normalized = String(value || "")
          .trim()
          .toLowerCase();

        return VALID_CATEGORIES.has(normalized)
          ? normalized
          : "all";
      }

      function normalizeSort(value) {
        const normalized = String(value || "")
          .trim()
          .toLowerCase();

        return VALID_SORTS.has(normalized)
          ? normalized
          : "featured";
      }

      function normalizeSearch(value) {
        return String(value || "")
          .trim()
          .replace(/\s+/g, " ")
          .slice(0, 100);
      }

      function getProductId(product) {
        return String(product?.id ?? "");
      }

      function getImages(product) {
        const images =
          Array.isArray(product?.images)
            ? product.images.filter(
                (src) =>
                  typeof src === "string" &&
                  src.trim()
              )
            : [];

        if (images.length) {
          return images;
        }

        if (
          typeof product?.image_url === "string" &&
          product.image_url.trim()
        ) {
          return [product.image_url.trim()];
        }

        return [FALLBACK_IMG];
      }

      function getStock(product) {
        return (
          product?.stock &&
          typeof product.stock === "object" &&
          !Array.isArray(product.stock)
        )
          ? product.stock
          : {};
      }

      function getAvailableSizes(product) {
        const stock = getStock(product);

        return SIZES.filter(
          (size) => Number(stock[size] || 0) > 0
        );
      }

      function isSoldOut(product) {
        return getAvailableSizes(product).length === 0;
      }

      function firstAvailableSize(product) {
        return getAvailableSizes(product)[0] || null;
      }

      function getSelectedSize(product) {
        const id = getProductId(product);
        const selected = cardSizeSelection.get(id);

        if (
          selected &&
          getAvailableSizes(product).includes(selected)
        ) {
          return selected;
        }

        const fallback = firstAvailableSize(product);

        if (fallback) {
          cardSizeSelection.set(id, fallback);
        }

        return fallback;
      }

      function getProductSearchText(product) {
        return [
          product?.name,
          product?.korean_name,
          product?.korean,
          product?.description,
          product?.category
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
      }

      function getCreatedTimestamp(product) {
        const value = Date.parse(product?.created_at || "");
        return Number.isFinite(value) ? value : 0;
      }

      function formatPrice(value) {
        return `₹${Number(value || 0).toLocaleString("en-IN")}`;
      }

      /* =====================================================
         URL STATE
         ===================================================== */

      function readUrlState() {
        const params = new URLSearchParams(
          window.location.search
        );

        selectedCat = normalizeCategory(
          params.get(PARAMS.category)
        );

        searchQuery = normalizeSearch(
          params.get(PARAMS.search)
        );

        selectedSort = normalizeSort(
          params.get(PARAMS.sort)
        );

        if (searchInput) {
          searchInput.value = searchQuery;
        }

        if (sortSelect) {
          sortSelect.value = selectedSort;
        }

        syncFilterUI();
      }

      function writeUrlState({
        replace = true
      } = {}) {
        const url = new URL(
          window.location.href
        );

        /*
         * Keep URLs clean:
         * /shop.html
         * /shop.html?category=tees
         * /shop.html?q=hoodie
         * /shop.html?category=tees&q=black&sort=price-low
         */

        url.searchParams.delete(PARAMS.category);
        url.searchParams.delete(PARAMS.search);
        url.searchParams.delete(PARAMS.sort);

        if (selectedCat !== "all") {
          url.searchParams.set(
            PARAMS.category,
            selectedCat
          );
        }

        if (searchQuery) {
          url.searchParams.set(
            PARAMS.search,
            searchQuery
          );
        }

        if (selectedSort !== "featured") {
          url.searchParams.set(
            PARAMS.sort,
            selectedSort
          );
        }

        const nextUrl =
          url.pathname +
          (url.search ? url.search : "") +
          url.hash;

        if (replace) {
          window.history.replaceState(
            { shop: true },
            "",
            nextUrl
          );
        } else {
          window.history.pushState(
            { shop: true },
            "",
            nextUrl
          );
        }
      }

      function syncFilterUI() {
        filterButtons.forEach((button) => {
          const active =
            button.dataset.cat === selectedCat;

          button.classList.toggle(
            "active",
            active
          );

          button.setAttribute(
            "aria-pressed",
            active ? "true" : "false"
          );
        });
      }

      /* =====================================================
         FILTERING / SEARCH / SORT
         ===================================================== */

      function getVisibleProducts() {
        let products = [...allProducts];

        if (selectedCat !== "all") {
          products = products.filter(
            (product) =>
              String(product?.category || "")
                .trim()
                .toLowerCase() === selectedCat
          );
        }

        if (searchQuery) {
          const query =
            searchQuery.toLowerCase();

          products = products.filter(
            (product) =>
              getProductSearchText(product).includes(
                query
              )
          );
        }

        switch (selectedSort) {
          case "price-low":
            products.sort(
              (a, b) =>
                Number(a?.price || 0) -
                Number(b?.price || 0)
            );
            break;

          case "price-high":
            products.sort(
              (a, b) =>
                Number(b?.price || 0) -
                Number(a?.price || 0)
            );
            break;

          case "newest":
            products.sort(
              (a, b) =>
                getCreatedTimestamp(b) -
                getCreatedTimestamp(a)
            );
            break;

          case "featured":
          default:
            /*
             * Supabase already returns newest first.
             * Stable copy prevents accidental mutation of
             * allProducts.
             */
            break;
        }

        return products;
      }

      /* =====================================================
         SKELETON
         ===================================================== */

      function renderSkeleton() {
        if (!grid) return;

        grid.setAttribute(
          "aria-busy",
          "true"
        );

        grid.innerHTML = Array.from(
          { length: 8 },
          () => `
            <div class="p-skeleton" aria-hidden="true">
              <div class="p-thumb"></div>
              <div
                class="sk-line"
                style="width:80%;"
              ></div>
              <div
                class="sk-line"
                style="width:50%;"
              ></div>
            </div>
          `
        ).join("");
      }

      /* =====================================================
         ERROR STATE
         ===================================================== */

      function renderErrorState(message) {
        if (!grid) return;

        grid.setAttribute(
          "aria-busy",
          "false"
        );

        grid.innerHTML = `
          <div class="shop-state-msg">
            <strong>Unable to load the catalogue</strong>
            <span>
              ${escapeHtml(
                message ||
                "Please check your connection and try again."
              )}
            </span>
            <br>
            <button
              type="button"
              class="shop-retry-btn"
              id="shopRetry"
            >RETRY</button>
          </div>
        `;

        document
          .getElementById("shopRetry")
          ?.addEventListener(
            "click",
            loadProducts,
            { once: true }
          );
      }

      /* =====================================================
         EMPTY STATES
         ===================================================== */

      function renderEmptyCatalogue() {
        grid.setAttribute(
          "aria-busy",
          "false"
        );

        grid.innerHTML = `
          <div class="shop-state-msg">
            <strong>
              No pieces in the catalogue yet
            </strong>
            <span>
              Check back soon — new drops are on the way.
            </span>
          </div>
        `;
      }

      function renderNoResults() {
        grid.setAttribute(
          "aria-busy",
          "false"
        );

        grid.innerHTML = `
          <div class="shop-state-msg">
            <strong>
              No pieces found
            </strong>
            <span>
              Try a different category or search term.
            </span>
            <br>
            <button
              type="button"
              class="shop-retry-btn"
              id="clearShopFilters"
            >CLEAR FILTERS</button>
          </div>
        `;

        document
          .getElementById("clearShopFilters")
          ?.addEventListener(
            "click",
            clearAllFilters,
            { once: true }
          );
      }

      /* =====================================================
         CARD MARKUP
         ===================================================== */

      function renderProductCard(product) {
        const id = getProductId(product);
        const images = getImages(product);
        const image = images[0] || FALLBACK_IMG;
        const stock = getStock(product);
        const soldOut = isSoldOut(product);
        const selectedSize = getSelectedSize(product);

        const categoryLabel =
          String(
            product?.category || "NEW"
          ).toUpperCase();

        const productName =
          product?.name ||
          "Untitled Garment";

        const koreanName =
          product?.korean_name ||
          product?.korean ||
          "";

        const price = Number(
          product?.price || 0
        );

        const encodedId =
          encodeURIComponent(id);

        const sizes = SIZES.map((size) => {
          const available =
            Number(stock[size] || 0) > 0;

          const active =
            selectedSize === size;

          return `
            <button
              type="button"
              class="p-size-chip${active ? " active" : ""}"
              data-action="select-size"
              data-pid="${escapeAttribute(id)}"
              data-size="${size}"
              ${available ? "" : "disabled"}
              aria-label="Select size ${size}"
              aria-pressed="${active ? "true" : "false"}"
            >${size}</button>
          `;
        }).join("");

        return `
          <article
            class="p-card"
            data-product-id="${escapeAttribute(id)}"
          >

            <a
              class="p-card-link"
              href="product.html?id=${encodedId}"
              aria-label="View ${escapeAttribute(productName)}"
            >
              <div
                class="p-thumb${soldOut ? " is-sold-out" : ""}"
              >
                <span class="p-tag">
                  ${escapeHtml(categoryLabel)}
                </span>

                <img
                  src="${escapeAttribute(image)}"
                  alt="${escapeAttribute(productName)}"
                  loading="lazy"
                  decoding="async"
                  data-product-image
                >

                ${
                  soldOut
                    ? `
                      <div
                        class="p-sold-out-badge"
                        aria-label="Sold out"
                      >
                        SOLD OUT
                      </div>
                    `
                    : ""
                }
              </div>

              <div class="p-info">
                <div class="p-copy">
                  <h3>
                    ${escapeHtml(productName)}
                  </h3>

                  <div class="p-sub">
                    ${escapeHtml(koreanName)}
                  </div>
                </div>

                <div class="p-meta">
                  <span class="p-price">
                    ${formatPrice(price)}
                  </span>

                  <span class="p-btn-view">
                    VIEW DETAILS
                  </span>
                </div>
              </div>
            </a>

            <div class="p-quickadd">

              ${sizes}

              <button
                type="button"
                class="p-quickadd-btn"
                data-action="add-to-bag"
                data-pid="${escapeAttribute(id)}"
                ${soldOut ? "disabled" : ""}
              >
                ${
                  soldOut
                    ? "SOLD OUT"
                    : "ADD TO BAG"
                }
              </button>

            </div>

          </article>
        `;
      }

      /* =====================================================
         RENDER SHOP
         ===================================================== */

      function renderShop() {
        if (!grid) return;

        const visibleProducts =
          getVisibleProducts();

        heading.textContent =
          CATEGORY_LABELS[selectedCat];

        count.textContent =
          `${visibleProducts.length} PIECE${
            visibleProducts.length === 1
              ? ""
              : "S"
          } AVAILABLE`;

        syncFilterUI();

        grid.setAttribute(
          "aria-busy",
          "false"
        );

        if (!allProducts.length) {
          renderEmptyCatalogue();
          return;
        }

        if (!visibleProducts.length) {
          renderNoResults();
          return;
        }

        grid.innerHTML =
          visibleProducts
            .map(renderProductCard)
            .join("");

        /*
         * Images can fail individually. Replace with the same
         * existing fallback instead of allowing broken-image
         * layout artifacts.
         */
        grid
          .querySelectorAll(
            "[data-product-image]"
          )
          .forEach((image) => {
            image.addEventListener(
              "error",
              () => {
                if (
                  image.dataset.fallbackApplied ===
                  "true"
                ) {
                  return;
                }

                image.dataset.fallbackApplied =
                  "true";

                image.src = FALLBACK_IMG;
                image.classList.add(
                  "image-failed"
                );
              },
              { once: true }
            );
          });
      }

      function withTimeout(promise, ms = 12000) {
        let timer = null;

        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => {
            reject(new Error("Catalogue request timed out. Please retry."));
          }, ms);
        });

        return Promise.race([promise, timeout]).finally(() => {
          if (timer) clearTimeout(timer);
        });
      }

      /* =====================================================
         LOAD PRODUCTS
         ===================================================== */

      async function loadProducts() {
        if (isLoading) return;

        isLoading = true;
        renderSkeleton();

        if (!supabaseClient) {
          isLoading = false;
          renderErrorState(
            "Store is currently offline."
          );
          return;
        }

        try {
          const {
            data,
            error
          } = await withTimeout(
            supabaseClient
              .from("products")
              .select("*")
              .order(
                "created_at",
                { ascending: false }
              )
          );

          if (error) {
            throw error;
          }

          /*
           * Missing/null active remains live.
           * Only explicit false is hidden.
           */
          allProducts = Array.isArray(data)
            ? data.filter(
                (product) =>
                  product?.active !== false
              )
            : [];

          /*
           * Clean stale size selections when a
           * product disappears from the catalogue.
           */
          const liveIds = new Set(
            allProducts.map(getProductId)
          );

          for (const id of cardSizeSelection.keys()) {
            if (!liveIds.has(id)) {
              cardSizeSelection.delete(id);
            }
          }

          renderShop();
        } catch (error) {
          console.error(
            "BULKKOT catalogue load failed:",
            error
          );

          renderErrorState(
            error?.message ||
            "Please check your connection and try again."
          );
        } finally {
          isLoading = false;
        }
      }

      /* =====================================================
         CATEGORY
         ===================================================== */

      function setCategory(category) {
        const next =
          normalizeCategory(category);

        if (selectedCat === next) {
          syncFilterUI();
          return;
        }

        selectedCat = next;

        writeUrlState({
          replace: true
        });

        renderShop();
      }

      /* =====================================================
         SEARCH
         ===================================================== */

      function setSearch(value) {
        searchQuery =
          normalizeSearch(value);

        writeUrlState({
          replace: true
        });

        renderShop();
      }

      /* =====================================================
         SORT
         ===================================================== */

      function setSort(value) {
        selectedSort =
          normalizeSort(value);

        if (sortSelect) {
          sortSelect.value =
            selectedSort;
        }

        writeUrlState({
          replace: true
        });

        renderShop();
      }

      /* =====================================================
         CLEAR FILTERS
         ===================================================== */

      function clearAllFilters() {
        selectedCat = "all";
        searchQuery = "";
        selectedSort = "featured";

        if (searchInput) {
          searchInput.value = "";
        }

        if (sortSelect) {
          sortSelect.value = "featured";
        }

        writeUrlState({
          replace: true
        });

        renderShop();
      }

      /* =====================================================
         QUICK ADD
         ===================================================== */

      function addProductToBag(product) {
        if (!product) return;

        const id =
          getProductId(product);

        const availableSizes =
          getAvailableSizes(product);

        if (!availableSizes.length) {
          return;
        }

        let selected =
          cardSizeSelection.get(id);

        if (
          !selected ||
          !availableSizes.includes(selected)
        ) {
          selected =
            availableSizes[0];

          cardSizeSelection.set(
            id,
            selected
          );
        }

        if (
          window.BULKKOT_CART &&
          typeof window.BULKKOT_CART.addItem ===
            "function"
        ) {
          window.BULKKOT_CART.addItem({
            id: product.id,
            name:
              product.name ||
              "Untitled Garment",
            price:
              Number(product.price || 0),
            size: selected,
            image:
              getImages(product)[0] ||
              FALLBACK_IMG,
            quantity: 1
          });

          return;
        }

        /*
         * Defensive fallback:
         * cart.js normally exposes BULKKOT_CART.
         * If it does not, fail silently rather than
         * throwing and breaking the catalogue.
         */
        console.warn(
          "BULKKOT_CART.addItem is unavailable."
        );
      }

      /* =====================================================
         GRID EVENT DELEGATION
         ===================================================== */

      grid.addEventListener(
        "click",
        (event) => {
          const target =
            event.target;

          if (!(target instanceof Element)) {
            return;
          }

          const sizeButton =
            target.closest(
              '[data-action="select-size"]'
            );

          if (sizeButton) {
            event.preventDefault();
            event.stopPropagation();

            if (sizeButton.disabled) {
              return;
            }

            const id =
              sizeButton.dataset.pid;

            const size =
              sizeButton.dataset.size;

            if (!id || !SIZES.includes(size)) {
              return;
            }

            const product =
              allProducts.find(
                (item) =>
                  getProductId(item) === id
              );

            if (!product) return;

            if (
              !getAvailableSizes(
                product
              ).includes(size)
            ) {
              return;
            }

            cardSizeSelection.set(
              id,
              size
            );

            /*
             * Re-rendering only changes the catalogue DOM.
             * Page scroll position is intentionally untouched.
             */
            renderShop();
            return;
          }

          const addButton =
            target.closest(
              '[data-action="add-to-bag"]'
            );

          if (addButton) {
            event.preventDefault();
            event.stopPropagation();

            if (addButton.disabled) {
              return;
            }

            const id =
              addButton.dataset.pid;

            if (!id) return;

            const product =
              allProducts.find(
                (item) =>
                  getProductId(item) === id
              );

            addProductToBag(product);
          }
        }
      );

      /* =====================================================
         FILTER EVENTS
         ===================================================== */

      filterButtons.forEach(
        (button) => {
          button.addEventListener(
            "click",
            () => {
              setCategory(
                button.dataset.cat
              );
            }
          );
        }
      );

      /* =====================================================
         SORT EVENT
         ===================================================== */

      sortSelect.addEventListener(
        "change",
        (event) => {
          setSort(
            event.target.value
          );
        }
      );

      /* =====================================================
         SEARCH EVENTS
         ===================================================== */

      searchInput.addEventListener(
        "input",
        (event) => {
          clearTimeout(
            searchDebounce
          );

          const value =
            event.target.value;

          searchDebounce =
            setTimeout(() => {
              setSearch(value);
            }, 180);
        }
      );

      /*
       * Enter = immediately apply search rather than
       * waiting for debounce.
       */
      searchInput.addEventListener(
        "keydown",
        (event) => {
          if (event.key !== "Enter") {
            return;
          }

          event.preventDefault();

          clearTimeout(
            searchDebounce
          );

          setSearch(
            event.target.value
          );
        }
      );

      /* =====================================================
         BROWSER BACK / FORWARD
         ===================================================== */

      window.addEventListener(
        "popstate",
        () => {
          readUrlState();
          renderShop();
        }
      );

      /* =====================================================
         INIT
         ===================================================== */

      readUrlState();
      loadProducts();

    })();
  </script>

</body>
</html>
