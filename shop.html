<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SHOP SILHOUETTES — BULKKOT (불꽃)</title>
  <link rel="icon" href="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png">

  <!-- Fonts & Core CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background: #070707; color: #f5f5f5; font-family: 'Inter', sans-serif; }
    .shop-container { max-width: 1360px; margin: 0 auto; padding: 24px 16px 80px; }

    /* Top Horizontal Bar (Myntra Style Filter & Sort) */
    .shop-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #1a1a1a;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .shop-title-area h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin: 0;
      text-transform: uppercase;
    }
    .shop-title-area p {
      font-size: 11px;
      color: #888;
      margin: 4px 0 0;
      letter-spacing: 0.1em;
    }

    /* Horizontal Filter Strip */
    .filter-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .filter-btn {
      background: #121212;
      border: 1px solid #242424;
      color: #999;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .sort-wrap select {
      background: #121212;
      border: 1px solid #242424;
      color: #fff;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    /* 4-col desktop, 2-col mobile */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .p-card {
      background: #0e0e0e;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s;
    }
    .p-card:hover { border-color: #333; }

    .p-thumb {
      width: 100%;
      height: 320px;
      background: #141414;
      position: relative;
      overflow: hidden;
    }
    .p-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .p-card:hover .p-thumb img { transform: scale(1.04); }

    .p-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #000;
      border: 1px solid #222;
      color: var(--bk-red, #e31b23);
      font-size: 9px;
      font-weight: 800;
      padding: 4px 8px;
      letter-spacing: 0.1em;
    }

    .p-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .p-info h3 { font-size: 12px; font-weight: 800; margin: 0 0 4px; letter-spacing: 0.05em; color: #eee; }
    .p-info .p-sub { font-size: 10px; color: #777; margin-bottom: 10px; }
    .p-meta { display: flex; justify-content: space-between; align-items: center; }
    .p-price { font-size: 13px; font-weight: 900; color: #fff; }
    .p-btn-view {
      background: transparent;
      border: 1px solid #333;
      color: #ccc;
      font-size: 10px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 3px;
    }
    .p-card:hover .p-btn-view { background: #fff; color: #000; border-color: #fff; }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .p-thumb { height: 210px; }
      .p-info { padding: 10px; }
      .p-info h3 { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .p-price { font-size: 12px; }
      .p-btn-view { font-size: 9px; padding: 5px 8px; }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
        <img src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png" alt="BULKKOT logo" class="brand-logo" style="width:36px; height:36px;">
        <span class="brand-name">
          <span class="brand-korean" style="color:var(--bk-red, #e31b23); font-weight:700;">불꽃</span>
          <span class="brand-english" style="color:#fff; font-weight:900;">BULKKOT</span>
        </span>
      </a>
      <div class="header-actions">
        <a href="index.html#top" class="nav-btn" style="color:#aaa; font-size:11px; font-weight:700; text-decoration:none;">← HOME</a>
        <button type="button" class="header-action cart-action" data-open-cart aria-label="Open cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h2l1.7 11h9.8L20 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shop-container">
    <!-- Top Filter & Sorting Bar -->
    <div class="shop-header-bar">
      <div class="shop-title-area">
        <h1 id="shopHeading">CATALOGUE</h1>
        <p id="shopCount">SHOWING SILHOUETTES</p>
      </div>

      <!-- Quick Filter Strip -->
      <div class="filter-strip">
        <button class="filter-btn active" data-cat="all">ALL PIECES</button>
        <button class="filter-btn" data-cat="tees">TEES (티셔츠)</button>
        <button class="filter-btn" data-cat="hoods">HOODIES (후드)</button>
        <button class="filter-btn" data-cat="sweats">SWEATS (스웨트)</button>
      </div>

      <!-- Sort Dropdown -->
      <div class="sort-wrap">
        <select id="shopSort">
          <option value="featured">FEATURED</option>
          <option value="price-low">PRICE: LOW TO HIGH</option>
          <option value="price-high">PRICE: HIGH TO LOW</option>
          <option value="newest">NEWEST</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="products-grid" id="shopGrid">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- CART DRAWER -->
  <div class="drawer-overlay" data-cart-overlay></div>
  <aside class="cart-drawer" id="cart-drawer" data-cart-drawer aria-hidden="true"></aside>

  <script src="js/cart.js"></script>
  <script>
    const MOCK_PRODUCTS = [
      {
        id: "bk-tee-01",
        name: "HEAVY ARCHITECTURAL BOXY TEE",
        category: "tees",
        korean: "오버사이즈 티셔츠",
        price: 2499,
        tag: "DROP 001",
        image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13581.png"
      },
      {
        id: "bk-hood-01",
        name: "STRUCTURED LOOPBACK HOODIE",
        category: "hoods",
        korean: "헤비웨이트 후드",
        price: 4499,
        tag: "LIMITED",
        image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13579.png"
      },
      {
        id: "bk-sweat-01",
        name: "MINIMALIST OVERSIZED SWEATSHIRT",
        category: "sweats",
        korean: "미니멀 스웨트",
        price: 3699,
        tag: "CORE",
        image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13577.png"
      },
      {
        id: "bk-tee-02",
        name: "SEOUL SILHOUETTE GRAPHIC TEE",
        category: "tees",
        korean: "그래픽 티셔츠",
        price: 2699,
        tag: "DROP 001",
        image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png"
      }
    ];

    let currentProducts = [...MOCK_PRODUCTS];
    let selectedCat = "all";

    // URL Param Check (?category=tees etc.)
    const urlParams = new URLSearchParams(window.location.search);
    const catParam = urlParams.get('category');
    if (catParam) selectedCat = catParam.toLowerCase();

    function renderShop() {
      const grid = document.getElementById('shopGrid');
      let filtered = selectedCat === 'all' 
        ? [...currentProducts] 
        : currentProducts.filter(p => p.category === selectedCat);

      const sortVal = document.getElementById('shopSort').value;
      if (sortVal === 'price-low') filtered.sort((a, b) => a.price - b.price);
      if (sortVal === 'price-high') filtered.sort((a, b) => b.price - a.price);

      document.getElementById('shopHeading').textContent = selectedCat === 'all' ? 'ALL SILHOUETTES' : selectedCat.toUpperCase() + ' COLLECTION';
      document.getElementById('shopCount').textContent = `${filtered.length} PIECES AVAILABLE`;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === selectedCat);
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:60px 0; color:#777;">No pieces found in this category.</p>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <a href="product.html?id=${p.id}" class="p-card">
          <div class="p-thumb">
            <span class="p-tag">${p.tag}</span>
            <img src="${p.image}" alt="${p.name}" loading="lazy">
          </div>
          <div class="p-info">
            <div>
              <h3>${p.name}</h3>
              <div class="p-sub">${p.korean}</div>
            </div>
            <div class="p-meta">
              <span class="p-price">₹${p.price.toLocaleString('en-IN')}</span>
              <span class="p-btn-view">VIEW DETAILS</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCat = btn.dataset.cat;
        renderShop();
      });
    });

    document.getElementById('shopSort').addEventListener('change', renderShop);
    renderShop();
  </script>
</body>
</html>
