<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SHOP SILHOUETTES — BULKKOT (불꽃)</title>

  <!-- OpenGraph / Social Share Preview (WhatsApp, Instagram, Facebook, Slack) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BULKKOT (불꽃)">
  <meta property="og:title" content="Shop Silhouettes — BULKKOT (불꽃)">
  <meta property="og:description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats, Korean-inspired oversized essentials.">
  <meta property="og:url" content="https://bulkkot.com/shop.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png">
  <meta property="og:image:width" content="541">
  <meta property="og:image:height" content="359">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop Silhouettes — BULKKOT (불꽃)">
  <meta name="twitter:description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png">

  <link rel="icon" href="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png">

  <!-- Fonts & Core CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background: #070707; color: #f5f5f5; font-family: 'Inter', sans-serif; }
    .shop-container { max-width: 1360px; margin: 0 auto; padding: 24px 16px 80px; }

    /* Top Horizontal Bar (Myntra Style Filter & Sort) */
    .shop-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #1a1a1a;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .shop-title-area h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin: 0;
      text-transform: uppercase;
    }
    .shop-title-area p {
      font-size: 11px;
      color: #888;
      margin: 4px 0 0;
      letter-spacing: 0.1em;
    }

    /* Horizontal Filter Strip */
    .filter-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .filter-btn {
      background: #121212;
      border: 1px solid #242424;
      color: #999;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .sort-wrap select {
      background: #121212;
      border: 1px solid #242424;
      color: #fff;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    /* 4-col desktop, 2-col mobile */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .p-card {
      background: #0e0e0e;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s;
    }
    .p-card:hover { border-color: #333; }

    .p-thumb {
      width: 100%;
      height: 320px;
      background: #141414;
      position: relative;
      overflow: hidden;
    }
    .p-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .p-card:hover .p-thumb img { transform: scale(1.04); }

    .p-thumb.is-sold-out img { opacity: 0.45; filter: grayscale(0.4); }
    .p-sold-out-badge {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; letter-spacing: 0.15em; color: #fff;
      background: rgba(0,0,0,0.55);
    }

    .p-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #000;
      border: 1px solid #222;
      color: var(--bk-red, #e31b23);
      font-size: 9px;
      font-weight: 800;
      padding: 4px 8px;
      letter-spacing: 0.1em;
    }

    .p-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .p-info h3 { font-size: 12px; font-weight: 800; margin: 0 0 4px; letter-spacing: 0.05em; color: #eee; }
    .p-info .p-sub { font-size: 10px; color: #777; margin-bottom: 10px; }
    .p-meta { display: flex; justify-content: space-between; align-items: center; }
    .p-price { font-size: 13px; font-weight: 900; color: #fff; }
    .p-btn-view {
      background: transparent;
      border: 1px solid #333;
      color: #ccc;
      font-size: 10px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 3px;
      text-decoration: none;
    }
    .p-card:hover .p-btn-view { background: #fff; color: #000; border-color: #fff; }

    /* Quick-add row: size chips + add-to-bag, shown under card info */
    .p-quickadd { display: flex; gap: 6px; align-items: center; padding: 0 14px 14px; }
    .p-size-chip {
      width: 26px; height: 26px; font-size: 9px; font-weight: 800;
      border: 1px solid #2a2a2a; background: #111; color: #ccc;
      border-radius: 3px; cursor: pointer; display: grid; place-items: center;
    }
    .p-size-chip.active { border-color: #fff; background: #fff; color: #000; }
    .p-size-chip:disabled { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }
    .p-quickadd-btn {
      flex: 1; min-height: 26px; background: var(--bk-red, #e31b23); color: #fff;
      font-size: 9px; font-weight: 900; letter-spacing: 0.08em; border: none;
      border-radius: 3px; cursor: pointer;
    }
    .p-quickadd-btn:disabled { background: #2a2a2a; color: #777; cursor: not-allowed; }

    /* Loading skeleton */
    .p-skeleton { background: #0e0e0e; border: 1px solid #1a1a1a; border-radius: 6px; overflow: hidden; }
    .p-skeleton .p-thumb { background: linear-gradient(100deg, #141414 30%, #1c1c1c 50%, #141414 70%); background-size: 200% 100%; animation: shopShimmer 1.4s infinite; }
    .p-skeleton .sk-line { height: 10px; background: #161616; border-radius: 3px; margin: 12px 14px; }
    @keyframes shopShimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .shop-state-msg { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #888; }
    .shop-state-msg strong { display: block; color: #fff; font-size: 14px; margin-bottom: 8px; }
    .shop-retry-btn { margin-top: 14px; background: transparent; border: 1px solid #333; color: #ccc; font-size: 11px; font-weight: 700; padding: 8px 18px; border-radius: 4px; cursor: pointer; }
    .shop-retry-btn:hover { background: #fff; color: #000; }

    .search-wrap { position: relative; flex: 1; min-width: 160px; max-width: 260px; }
    .search-wrap input {
      width: 100%; background: #121212; border: 1px solid #242424; color: #fff;
      font-size: 11px; padding: 8px 12px; border-radius: 4px; outline: none;
    }
    .search-wrap input:focus { border-color: #444; }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .p-thumb { height: 210px; }
      .p-info { padding: 10px; }
      .p-info h3 { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .p-price { font-size: 12px; }
      .p-btn-view { font-size: 9px; padding: 5px 8px; }
      .search-wrap { max-width: 100%; order: 3; }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
        <img src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png" alt="BULKKOT logo" class="brand-logo" style="width:36px; height:36px;">
        <span class="brand-name">
          <span class="brand-korean" style="color:var(--bk-red, #e31b23); font-weight:700;">불꽃</span>
          <span class="brand-english" style="color:#fff; font-weight:900;">BULKKOT</span>
        </span>
      </a>
      <div class="header-actions">
        <a href="index.html#top" class="nav-btn" style="color:#aaa; font-size:11px; font-weight:700; text-decoration:none;">← HOME</a>
        <button type="button" class="header-action cart-action" data-open-cart aria-label="Open cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h2l1.7 11h9.8L20 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shop-container">
    <!-- Top Filter & Sorting Bar -->
    <div class="shop-header-bar">
      <div class="shop-title-area">
        <h1 id="shopHeading">CATALOGUE</h1>
        <p id="shopCount">SHOWING SILHOUETTES</p>
      </div>

      <!-- Quick Filter Strip -->
      <div class="filter-strip">
        <button class="filter-btn active" data-cat="all">ALL PIECES</button>
        <button class="filter-btn" data-cat="tees">TEES (티셔츠)</button>
        <button class="filter-btn" data-cat="hoods">HOODIES (후드)</button>
        <button class="filter-btn" data-cat="sweats">SWEATS (스웨트)</button>
      </div>

      <div class="search-wrap">
        <input type="text" id="shopSearch" placeholder="SEARCH SILHOUETTES..." autocomplete="off">
      </div>

      <!-- Sort Dropdown -->
      <div class="sort-wrap">
        <select id="shopSort">
          <option value="featured">FEATURED</option>
          <option value="price-low">PRICE: LOW TO HIGH</option>
          <option value="price-high">PRICE: HIGH TO LOW</option>
          <option value="newest">NEWEST</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="products-grid" id="shopGrid">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- CART DRAWER -->
  <div class="drawer-overlay" data-cart-overlay></div>
  <aside class="cart-drawer" id="cart-drawer" data-cart-drawer aria-hidden="true"></aside>

  <script src="js/cart.js"></script>
  <script>
    const SUPABASE_URL = "https://pgubjluqgqvrybvehzeh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP";
    const supabase = window.supabase && typeof window.supabase.createClient === 'function'
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const SIZES = ["S", "M", "L", "XL"];
    const FALLBACK_IMG = "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png";

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    let allProducts = [];   // raw, active-only, from Supabase
    let selectedCat = "all";
    let searchQuery = "";
    const cardSizeSelection = {}; // productId -> chosen size, for quick-add

    // URL Param Check (?category=tees etc.)
    const urlParams = new URLSearchParams(window.location.search);
    const catParam = urlParams.get('category');
    if (catParam) selectedCat = catParam.toLowerCase();

    function getImages(p) {
      const imgs = (Array.isArray(p.images) && p.images.length) ? p.images : (p.image_url ? [p.image_url] : []);
      return imgs.length ? imgs : [FALLBACK_IMG];
    }

    function getStock(p) {
      return p.stock && typeof p.stock === "object" ? p.stock : {};
    }

    function isSoldOut(p) {
      const stock = getStock(p);
      return SIZES.every(s => Number(stock[s] || 0) <= 0);
    }

    function firstAvailableSize(p) {
      const stock = getStock(p);
      return SIZES.find(s => Number(stock[s] || 0) > 0) || null;
    }

    // ── SKELETON / EMPTY / ERROR STATES ──────────────────────────────
    function renderSkeleton() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = Array.from({ length: 8 }).map(() => `
        <div class="p-skeleton">
          <div class="p-thumb"></div>
          <div class="sk-line" style="width:80%;"></div>
          <div class="sk-line" style="width:50%;"></div>
        </div>
      `).join('');
    }

    function renderErrorState(message) {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = `
        <div class="shop-state-msg">
          <strong>Unable to load the catalogue</strong>
          ${escapeHtml(message || "Please check your connection and try again.")}
          <br><button class="shop-retry-btn" type="button" onclick="loadProducts()">RETRY</button>
        </div>
      `;
    }

    // ── FETCH ─────────────────────────────────────────────────────────
    async function loadProducts() {
      renderSkeleton();

      if (!supabase) {
        renderErrorState("Store is currently offline.");
        return;
      }

      try {
        const { data, error } = await supabase
          .from("products")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        // Only show products the admin has marked Live. Missing/null
        // `active` is treated as live (matches the admin panel's own
        // "isLive = p.active !== false" convention).
        allProducts = (data || []).filter(p => p.active !== false);
        renderShop();
      } catch (err) {
        console.error("Failed to load products:", err);
        renderErrorState(err.message);
      }
    }

    // ── RENDER ────────────────────────────────────────────────────────
    function renderShop() {
      const grid = document.getElementById('shopGrid');

      let filtered = selectedCat === 'all'
        ? [...allProducts]
        : allProducts.filter(p => (p.category || '').toLowerCase() === selectedCat);

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(p =>
          (p.name || '').toLowerCase().includes(q) ||
          (p.korean_name || p.korean || '').toLowerCase().includes(q)
        );
      }

      const sortVal = document.getElementById('shopSort').value;
      if (sortVal === 'price-low') filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
      if (sortVal === 'price-high') filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
      if (sortVal === 'newest') filtered.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

      document.getElementById('shopHeading').textContent = selectedCat === 'all' ? 'ALL SILHOUETTES' : selectedCat.toUpperCase() + ' COLLECTION';
      document.getElementById('shopCount').textContent = `${filtered.length} PIECE${filtered.length === 1 ? '' : 'S'} AVAILABLE`;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === selectedCat);
      });

      if (!allProducts.length) {
        grid.innerHTML = `<div class="shop-state-msg"><strong>No pieces in the catalogue yet</strong>Check back soon — new drops are on the way.</div>`;
        return;
      }
      if (!filtered.length) {
        grid.innerHTML = `<div class="shop-state-msg"><strong>No pieces found</strong>Try a different category or search term.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const images = getImages(p);
        const stock = getStock(p);
        const soldOut = isSoldOut(p);
        if (!(p.id in cardSizeSelection)) cardSizeSelection[p.id] = firstAvailableSize(p);
        const selSize = cardSizeSelection[p.id];

        return `
          <div class="p-card">
            <a href="product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none; color:inherit;">
              <div class="p-thumb ${soldOut ? 'is-sold-out' : ''}">
                <span class="p-tag">${escapeHtml((p.category || 'NEW').toUpperCase())}</span>
                <img src="${images[0]}" alt="${escapeHtml(p.name || '')}" loading="lazy">
                ${soldOut ? '<div class="p-sold-out-badge">SOLD OUT</div>' : ''}
              </div>
              <div class="p-info">
                <div>
                  <h3>${escapeHtml(p.name || 'Untitled Garment')}</h3>
                  <div class="p-sub">${escapeHtml(p.korean_name || p.korean || '')}</div>
                </div>
                <div class="p-meta">
                  <span class="p-price">₹${Number(p.price || 0).toLocaleString('en-IN')}</span>
                  <span class="p-btn-view">VIEW DETAILS</span>
                </div>
              </div>
            </a>
            <div class="p-quickadd">
              ${SIZES.map(s => {
                const avail = Number(stock[s] || 0) > 0;
                return `<button type="button" class="p-size-chip ${selSize === s ? 'active' : ''}"
                  data-pid="${p.id}" data-size="${s}" ${avail ? '' : 'disabled'}>${s}</button>`;
              }).join('')}
              <button type="button" class="p-quickadd-btn" data-pid="${p.id}" ${soldOut ? 'disabled' : ''}>
                ${soldOut ? 'SOLD OUT' : 'ADD TO BAG'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Event delegation for quick-add size chips + add-to-bag buttons
    // (grid is re-rendered often, so we bind once on the container).
    document.getElementById('shopGrid').addEventListener('click', (e) => {
      const chip = e.target.closest('.p-size-chip');
      if (chip) {
        e.preventDefault();
        cardSizeSelection[chip.dataset.pid] = chip.dataset.size;
        renderShop();
        return;
      }

      const addBtn = e.target.closest('.p-quickadd-btn');
      if (addBtn && !addBtn.disabled) {
        e.preventDefault();
        const p = allProducts.find(item => String(item.id) === addBtn.dataset.pid);
        if (!p) return;
        const size = cardSizeSelection[p.id] || firstAvailableSize(p);
        if (!size) return;

        if (window.BULKKOT_CART?.addItem) {
          window.BULKKOT_CART.addItem({
            id: p.id, name: p.name, price: Number(p.price || 0),
            size, image: getImages(p)[0], quantity: 1
          });
        }
      }
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCat = btn.dataset.cat;
        renderShop();
      });
    });

    document.getElementById('shopSort').addEventListener('change', renderShop);

    let searchDebounce;
    document.getElementById('shopSearch').addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        searchQuery = e.target.value.trim();
        renderShop();
      }, 200);
    });

    loadProducts();
  </script>
</body>
</html>
