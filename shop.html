<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SHOP SILHOUETTES — BULKKOT (불꽃)</title>
  <meta name="description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats, Korean-inspired oversized essentials.">
  <meta name="theme-color" content="#070707">

  <link rel="icon" href="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --shop-bg: #070707;
      --shop-card: #0e0e0e;
      --shop-surface: #121212;
      --shop-border: #1a1a1a;
      --shop-border-strong: #242424;
      --shop-text: #f5f5f5;
      --shop-muted: #888;
      --shop-red: var(--bk-red, #e31b23);
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      background: var(--shop-bg);
      color: var(--shop-text);
      font-family: 'Inter', sans-serif;
      overflow-x: clip;
    }

    button, a, input, select {
      -webkit-tap-highlight-color: transparent;
      font: inherit;
    }

    .shop-container {
      width: min(1360px, 100%);
      margin: 0 auto;
      padding: 24px 16px 80px;
      box-sizing: border-box;
    }

    .shop-header-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--shop-border);
      margin-bottom: 24px;
      min-width: 0;
    }

    .shop-title-area h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .shop-title-area p {
      margin: 5px 0 0;
      color: var(--shop-muted);
      font-size: 10px;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .filter-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0 4px;
    }
    .filter-strip::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 8px 16px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      background: var(--shop-surface);
      color: #999;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #fff; border-color: #fff; color: #000;
    }

    .search-wrap { width: 100%; min-width: 140px; }
    .shop-search {
      width: 100%;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      background: var(--shop-surface);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      outline: none;
    }
    .shop-search:focus { border-color: #444; }

    .shop-sort {
      width: 100%;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      background: var(--shop-surface);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      width: 100%;
    }

    .p-card {
      background: var(--shop-card);
      border: 1px solid var(--shop-border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
    }
    .p-card:hover { border-color: #333; }

    .p-card-link { display: block; color: inherit; text-decoration: none; }

    .p-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.12;
      background: #141414;
      overflow: hidden;
    }
    .p-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .p-card:hover .p-thumb img { transform: scale(1.04); }

    .p-tag {
      position: absolute;
      top: 10px; left: 10px; z-index: 2;
      padding: 5px 8px;
      border: 1px solid #222;
      background: rgba(0, 0, 0, 0.92);
      color: var(--shop-red);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .p-sold-out-badge {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.15em;
    }

    .p-info {
      padding: 14px;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .p-info h3 { margin: 0 0 4px; color: #eee; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-info .p-sub { margin: 0; color: #777; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .p-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .p-price { color: #fff; font-size: 13px; font-weight: 900; }

    .p-btn-view {
      padding: 6px 10px;
      border: 1px solid #333;
      border-radius: 3px;
      color: #ccc;
      font-size: 9px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .p-card:hover .p-btn-view { border-color: #fff; background: #fff; color: #000; }

    .p-quickadd {
      display: grid;
      grid-template-columns: repeat(4, 1fr) minmax(80px, 1.8fr);
      gap: 6px;
      padding: 0 14px 14px;
    }
    .p-size-chip {
      padding: 4px; border: 1px solid #2a2a2a; background: #111; color: #ccc; font-size: 9px; font-weight: 800; cursor: pointer;
    }
    .p-size-chip:hover:not(:disabled) { border-color: #777; color: #fff; }
    .p-size-chip.active { border-color: #fff; background: #fff; color: #000; }
    .p-size-chip:disabled { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }

    .p-quickadd-btn {
      padding: 8px 10px; border: 1px solid #333; background: #fff; color: #000; font-size: 9px; font-weight: 900; cursor: pointer;
    }
    .p-quickadd-btn:hover:not(:disabled) { background: #e31b23; color: #fff; border-color: #e31b23; }

    .shop-state { padding: 90px 20px; text-align: center; color: var(--shop-muted); }
    .shop-state strong { display: block; margin-bottom: 10px; color: #fff; font-size: 16px; font-weight: 900; }
    .shop-state p { font-size: 11px; margin-bottom: 18px; }

    .shop-skeleton-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    .shop-skeleton-card { border: 1px solid var(--shop-border); border-radius: 6px; background: var(--shop-card); overflow: hidden; }
    .shop-skeleton-image, .shop-skeleton-line { background: linear-gradient(100deg, #141414 30%, #1d1d1d 50%, #141414 70%); background-size: 200% 100%; animation: shopShimmer 1.4s infinite; }
    .shop-skeleton-image { width: 100%; aspect-ratio: 1 / 1.12; }
    .shop-skeleton-copy { padding: 14px; }
    .shop-skeleton-line { height: 10px; margin-bottom: 9px; border-radius: 2px; }

    @keyframes shopShimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    @media (max-width: 1100px) {
      .shop-header-bar { grid-template-columns: minmax(0, 1fr) auto; }
      .shop-title-area { grid-column: 1 / -1; }
      .filter-strip { grid-column: 1 / 2; }
      .products-grid, .shop-skeleton-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .shop-header-bar { grid-template-columns: 1fr; gap: 10px; padding: 12px 0; margin-bottom: 18px; }
      .shop-title-area { grid-column: 1 / -1; }
      .filter-strip { grid-column: 1 / -1; }
      .search-wrap { grid-column: 1 / -1; }
      .products-grid, .shop-skeleton-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;}
      .p-quickadd { display: none; }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="BULKKOT home" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
        <img src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png" alt="BULKKOT logo" class="brand-logo" width="36" height="36" style="width:36px; height:36px;">
        <span class="brand-name">
          <span class="brand-korean" style="color:var(--bk-red, #e31b23); font-weight:700;">불꽃</span>
          <span class="brand-english" style="color:#fff; font-weight:900;">BULKKOT</span>
        </span>
      </a>
      <div class="header-actions">
        <a href="index.html" class="nav-btn" style="color:#aaa; font-size:11px; font-weight:700; text-decoration:none;">← HOME</a>
        <button type="button" class="header-action cart-action" data-open-cart aria-label="Open cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 5h2l1.7 11h9.8L20 8H7"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="17" cy="20" r="1"></circle>
          </svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shop-container">
    <section class="shop-header-bar" aria-label="Catalogue controls">
      <div class="shop-title-area">
        <h1>SILHOUETTES</h1>
        <p>LESS NOISE. MORE PRESENCE.</p>
      </div>

      <div class="filter-strip" id="filterStrip" role="tablist">
        <button type="button" class="filter-btn active" data-category="all" role="tab">ALL</button>
        <button type="button" class="filter-btn" data-category="tees" role="tab">TEES</button>
        <button type="button" class="filter-btn" data-category="hoodies" role="tab">HOODIES</button>
        <button type="button" class="filter-btn" data-category="sweats" role="tab">SWEATS</button>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <div class="search-wrap">
          <input id="shopSearch" class="shop-search" type="search" placeholder="SEARCH SILHOUETTES">
        </div>
        
        <button type="button" class="filter-btn" data-size-guide-open style="color:#fff; border-color:#444;">SIZE GUIDE</button>
        
        <div class="sort-wrap">
          <select id="shopSort" class="shop-sort">
            <option value="featured">FEATURED</option>
            <option value="newest">NEWEST</option>
            <option value="price-low">PRICE: LOW → HIGH</option>
            <option value="price-high">PRICE: HIGH → LOW</option>
          </select>
        </div>
      </div>
    </section>

    <!-- UI STATES -->
    <section id="shopLoading" class="shop-skeleton-grid" style="display: grid;">
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line" style="width: 78%;"></div><div class="shop-skeleton-line" style="width: 52%;"></div></div></article>
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line" style="width: 78%;"></div><div class="shop-skeleton-line" style="width: 52%;"></div></div></article>
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line" style="width: 78%;"></div><div class="shop-skeleton-line" style="width: 52%;"></div></div></article>
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line" style="width: 78%;"></div><div class="shop-skeleton-line" style="width: 52%;"></div></div></article>
    </section>

    <section id="shopError" class="shop-state" style="display: none;">
      <strong>CATALOGUE UNAVAILABLE</strong>
      <p>We couldn't load silhouettes right now. Please try again.</p>
    </section>

    <section id="shopEmpty" class="shop-state" style="display: none;">
      <strong>NO SILHOUETTES FOUND</strong>
      <p id="shopEmptyText">Try another search or clear your filters.</p>
    </section>

    <section id="productsGrid" class="products-grid" style="display: none;"></section>
  </main>

  <div class="drawer-overlay" data-cart-overlay></div>
  <aside class="cart-drawer" id="cart-drawer" data-cart-drawer aria-hidden="true"></aside>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://pgubjluqgqvrybvehzeh.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP";
      const FALLBACK_IMG = "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png";
      const SIZES = ["S", "M", "L", "XL"];

      const supabaseClient = window.supabase && typeof window.supabase.createClient === "function"
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

      const FALLBACK_PRODUCTS = [
        { id: "bk-tee-01", name: "HEAVY ARCHITECTURAL BOXY TEE", category: "tees", korean: "오버사이즈 티셔츠", price: 2499, tag: "DROP 001", image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13581.png" },
        { id: "bk-hood-01", name: "STRUCTURED LOOPBACK HOODIE", category: "hoods", korean: "헤비웨이트 후드", price: 4499, tag: "LIMITED", image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13579.png" },
        { id: "bk-sweat-01", name: "MINIMALIST OVERSIZED SWEATSHIRT", category: "sweats", korean: "미니멀 스웨트", price: 3699, tag: "CORE", image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13577.png" },
        { id: "bk-tee-02", name: "SEOUL SILHOUETTE GRAPHIC TEE", category: "tees", korean: "그래픽 티셔츠", price: 2699, tag: "DROP 001", image: "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png" }
      ];

      const loadingEl = document.getElementById("shopLoading");
      const errorEl = document.getElementById("shopError");
      const emptyEl = document.getElementById("shopEmpty");
      const productsGrid = document.getElementById("productsGrid");
      const emptyTextEl = document.getElementById("shopEmptyText");
      const searchInput = document.getElementById("shopSearch");
      const sortSelect = document.getElementById("shopSort");
      const filterStrip = document.getElementById("filterStrip");

      let products = [];
      let filteredProducts = [];
      let activeCategory = "all";
      let searchTerm = "";
      let sortMode = "featured";
      const quickAddSelections = new Map();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('category')) activeCategory = urlParams.get('category').toLowerCase();
      if (urlParams.get('q')) { searchTerm = urlParams.get('q').trim(); searchInput.value = searchTerm; }

      // Safe state switcher
      function setViewState(state) {
        if (loadingEl) loadingEl.style.display = state === "loading" ? "grid" : "none";
        if (errorEl) errorEl.style.display = state === "error" ? "block" : "none";
        if (emptyEl) emptyEl.style.display = state === "empty" ? "block" : "none";
        if (productsGrid) productsGrid.style.display = state === "products" ? "grid" : "none";
      }

      function formatPrice(val) { return `₹${Number(val || 0).toLocaleString("en-IN")}`; }

      function getImages(p) {
        if (Array.isArray(p?.images) && p.images[0]) return p.images[0];
        return p?.image_url || p?.image || FALLBACK_IMG;
      }

      function getStock(p) {
        if (p?.stock && typeof p.stock === "object" && !Array.isArray(p.stock)) return p.stock;
        return { S: 10, M: 10, L: 10, XL: 10 };
      }

      function applyFilters() {
        const term = searchTerm.toLowerCase();
        
        filteredProducts = products.filter(p => {
          if (p.active === false) return false;
          const cat = String(p.category || "").toLowerCase();
          if (activeCategory !== "all" && cat !== activeCategory && !cat.includes(activeCategory)) return false;
          if (term) {
            const text = [p.name, p.category, p.korean, p.tag].join(" ").toLowerCase();
            if (!text.includes(term)) return false;
          }
          return true;
        });

        filteredProducts.sort((a, b) => {
          if (sortMode === "newest") return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0);
          if (sortMode === "price-low") return Number(a.price || 0) - Number(b.price || 0);
          if (sortMode === "price-high") return Number(b.price || 0) - Number(a.price || 0);
          return 0;
        });

        renderProducts();
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function renderProducts() {
        if (!filteredProducts.length) {
          if (emptyTextEl) emptyTextEl.textContent = searchTerm ? `No pieces match "${searchTerm}".` : "Try another category.";
          setViewState("empty");
          return;
        }

        productsGrid.innerHTML = filteredProducts.map(p => {
          const id = String(p.id);
          const name = p.name || "GARMENT";
          const img = getImages(p);
          const stockData = getStock(p);
          const availableSizes = SIZES.filter(s => Number(stockData[s] || 0) > 0);
          const soldOut = availableSizes.length === 0;
          const selectedSize = quickAddSelections.get(id) || availableSizes[0] || "M";
          const tag = p.tag ? p.tag : (p.category ? String(p.category).toUpperCase() : "DROP 001");

          return `
            <article class="p-card">
              <a href="product.html?id=${encodeURIComponent(id)}" class="p-card-link">
                <div class="p-thumb">
                  <img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'">
                  <span class="p-tag">${escapeHtml(tag)}</span>
                  ${soldOut ? '<span class="p-sold-out-badge">SOLD OUT</span>' : ''}
                </div>
                <div class="p-info">
                  <div>
                    <h3>${escapeHtml(name)}</h3>
                    <p class="p-sub">${escapeHtml(p.korean || "에센셜")}</p>
                  </div>
                  <div class="p-meta">
                    <span class="p-price">${formatPrice(p.price)}</span>
                    <span class="p-btn-view">VIEW PIECE</span>
                  </div>
                </div>
              </a>
              <div class="p-quickadd" data-quickadd-id="${id}">
                ${SIZES.map(s => {
                  const inStock = Number(stockData[s] || 0) > 0;
                  return `<button type="button" class="p-size-chip ${selectedSize === s ? 'active' : ''}" data-size="${s}" ${!inStock ? 'disabled' : ''}>${s}</button>`;
                }).join('')}
                <button type="button" class="p-quickadd-btn" data-quick-add ${soldOut ? 'disabled' : ''}>
                  ${soldOut ? "SOLD OUT" : "ADD TO BAG"}
                </button>
              </div>
            </article>
          `;
        }).join("");

        setViewState("products");
      }

      productsGrid.addEventListener("click", e => {
        const sizeBtn = e.target.closest(".p-size-chip");
        if (sizeBtn && !sizeBtn.disabled) {
          const wrap = sizeBtn.closest("[data-quickadd-id]");
          const id = wrap.dataset.quickaddId;
          const size = sizeBtn.dataset.size;
          quickAddSelections.set(id, size);
          wrap.querySelectorAll(".p-size-chip").forEach(b => b.classList.toggle("active", b.dataset.size === size));
        }

        const addBtn = e.target.closest("[data-quick-add]");
        if (addBtn && !addBtn.disabled) {
          const wrap = addBtn.closest("[data-quickadd-id]");
          const id = wrap.dataset.quickaddId;
          const product = products.find(p => String(p.id) === id);
          if (!product || !window.BULKKOT_CART) return;

          const size = quickAddSelections.get(id) || "M";
          window.BULKKOT_CART.addItem({
            id: product.id,
            name: product.name,
            price: Number(product.price || 0),
            size: size,
            image: getImages(product)[0] || FALLBACK_IMG,
            quantity: 1
          });
        }
      });

      filterStrip?.addEventListener("click", e => {
        const btn = e.target.closest(".filter-btn");
        if (!btn) return;
        activeCategory = btn.dataset.category || "all";
        filterStrip.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
        applyFilters();
      });

      searchInput?.addEventListener("input", () => {
        searchTerm = searchInput.value || "";
        applyFilters();
      });

      sortSelect?.addEventListener("change", () => {
        sortMode = sortSelect.value || "featured";
        applyFilters();
      });

      const withTimeout = (promise, ms = 6000) => {
        let timer;
        const timeoutPromise = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("Request timed out")), ms);
        });
        return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timer));
      };

      async function initializeData() {
        setViewState("loading");
        
        let loadedData = [];
        if (supabaseClient) {
          try {
            const { data, error } = await withTimeout(
              supabaseClient.from("products").select("*").order("created_at", { ascending: false })
            );
            if (!error && Array.isArray(data) && data.length > 0) {
              loadedData = data;
            }
          } catch (err) {
            console.warn("Supabase fetch failed or timed out, using fallbacks.");
          }
        }

        products = loadedData.length > 0 ? loadedData : FALLBACK_PRODUCTS;

        products.forEach(p => {
          const available = getAvailableSizes(p);
          if (available.length) quickAddSelections.set(String(p.id), available[0]);
        });

        if (filterStrip) {
          filterStrip.querySelectorAll(".filter-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.category === activeCategory));
        }

        applyFilters();
      }

      initializeData();
    })();
  </script>
