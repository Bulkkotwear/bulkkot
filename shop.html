<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SHOP SILHOUETTES — BULKKOT (불꽃)</title>
  <meta name="description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats, Korean-inspired oversized essentials.">
  <meta name="theme-color" content="#070707">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BULKKOT (불꽃)">
  <meta property="og:title" content="Shop Silhouettes — BULKKOT (불꽃)">
  <meta property="og:description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats, Korean-inspired oversized essentials.">
  <meta property="og:url" content="https://bulkkot.com/shop.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png">
  <meta property="og:image:width" content="541">
  <meta property="og:image:height" content="359">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop Silhouettes — BULKKOT (불꽃)">
  <meta name="twitter:description" content="Browse the full BULKKOT catalogue — tees, hoodies and sweats.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png">

  <link rel="icon" href="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --shop-bg: #070707;
      --shop-card: #0e0e0e;
      --shop-surface: #121212;
      --shop-border: #1a1a1a;
      --shop-border-strong: #242424;
      --shop-text: #f5f5f5;
      --shop-muted: #888;
      --shop-red: var(--bk-red, #e31b23);
    }

    /* FIX: Force browser to respect the 'hidden' attribute over display:grid */
    [hidden] {
      display: none !important;
    }

    html {
      overflow-x: clip;
      background: var(--shop-bg);
    }

    body {
      margin: 0;
      background: var(--shop-bg);
      color: var(--shop-text);
      font-family: 'Inter', sans-serif;
      overflow-x: clip;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a,
    input,
    select {
      -webkit-tap-highlight-color: transparent;
    }

    .shop-container {
      width: min(1360px, 100%);
      margin: 0 auto;
      padding: 24px 16px 80px;
      box-sizing: border-box;
    }

    .shop-header-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(180px, 260px) auto;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--shop-border);
      margin-bottom: 24px;
      min-width: 0;
    }

    .shop-title-area {
      min-width: 0;
    }

    .shop-title-area h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .shop-title-area p {
      margin: 5px 0 0;
      color: var(--shop-muted);
      font-size: 10px;
      line-height: 1.3;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .filter-strip {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      padding: 2px 0 4px;
    }

    .filter-strip::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 38px;
      min-width: 44px;
      padding: 8px 16px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      background: var(--shop-surface);
      color: #999;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn:focus-visible,
    .filter-btn.active {
      background: #fff;
      border-color: #fff;
      color: #000;
    }

    .filter-btn:focus-visible,
    .shop-search:focus-visible,
    .shop-sort:focus-visible,
    .p-size-chip:focus-visible,
    .p-quickadd-btn:focus-visible,
    .shop-retry-btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.75);
      outline-offset: 2px;
    }

    .search-wrap {
      min-width: 0;
      width: 100%;
    }

    .shop-search {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 38px;
      box-sizing: border-box;
      padding: 0 12px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      outline: none;
      background: var(--shop-surface);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .shop-search::placeholder {
      color: #666;
      opacity: 1;
    }

    .shop-search:focus {
      border-color: #444;
    }

    .sort-wrap {
      min-width: 0;
    }

    .shop-sort {
      display: block;
      width: 100%;
      min-height: 38px;
      box-sizing: border-box;
      padding: 0 12px;
      border: 1px solid var(--shop-border-strong);
      border-radius: 4px;
      outline: none;
      background: var(--shop-surface);
      color: #fff;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      width: 100%;
      min-width: 0;
      align-items: stretch;
    }

    .p-card {
      min-width: 0;
      background: var(--shop-card);
      border: 1px solid var(--shop-border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: inherit;
      transition: border-color 0.2s ease;
    }

    .p-card:hover {
      border-color: #333;
    }

    .p-card-link {
      display: block;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .p-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.12;
      min-width: 0;
      overflow: hidden;
      background: #141414;
      isolation: isolate;
    }

    .p-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .p-card:hover .p-thumb img {
      transform: scale(1.04);
    }

    .p-thumb.is-sold-out img {
      opacity: 0.45;
      filter: grayscale(0.4);
    }

    .p-thumb img.image-failed {
      object-fit: contain;
      padding: 20px;
      box-sizing: border-box;
      opacity: 0.65;
    }

    .p-tag {
      position: absolute;
      z-index: 2;
      top: 10px;
      left: 10px;
      max-width: calc(100% - 20px);
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 5px 8px;
      border: 1px solid #222;
      background: rgba(0, 0, 0, 0.92);
      color: var(--shop-red);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .p-sold-out-badge {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-align: center;
    }

    .p-info {
      min-width: 0;
      padding: 14px;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-sizing: border-box;
    }

    .p-copy {
      min-width: 0;
    }

    .p-info h3 {
      margin: 0 0 4px;
      overflow: hidden;
      color: #eee;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: 0.05em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .p-info .p-sub {
      min-height: 13px;
      margin: 0;
      overflow: hidden;
      color: #777;
      font-size: 10px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .p-meta {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .p-price {
      flex: 0 0 auto;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .p-btn-view {
      display: inline-flex;
      min-height: 32px;
      max-width: 100%;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #333;
      border-radius: 3px;
      color: #ccc;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .p-card:hover .p-btn-view {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .p-quickadd {
      display: grid;
      grid-template-columns: repeat(4, 1fr) minmax(80px, 1.8fr);
      gap: 6px;
      align-items: center;
      padding: 0 14px 14px;
      min-width: 0;
    }

    .p-size-chip,
    .p-quickadd-btn {
      min-width: 0;
      min-height: 38px;
      box-sizing: border-box;
      border-radius: 3px;
      cursor: pointer;
    }

    .p-size-chip {
      display: grid;
      place-items: center;
      padding: 4px;
      border: 1px solid #2a2a2a;
      background: #111;
      color: #ccc;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
    }

    .p-size-chip:hover:not(:disabled) {
      border-color: #777;
      color: #fff;
    }

    .p-size-chip.active {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .p-size-chip:disabled {
      opacity: 0.3;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .p-quickadd-btn {
      padding: 8px 10px;
      border: 1px solid #333;
      background: #fff;
      color: #000;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      white-space: nowrap;
      transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .p-quickadd-btn:hover:not(:disabled) {
      background: #e31b23;
      color: #fff;
      border-color: #e31b23;
    }

    .p-quickadd-btn:disabled {
      background: #1b1b1b;
      border-color: #222;
      color: #555;
      cursor: not-allowed;
    }

    .shop-state {
      width: 100%;
      box-sizing: border-box;
      padding: 90px 20px;
      color: var(--shop-muted);
      text-align: center;
    }

    .shop-state strong {
      display: block;
      margin-bottom: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .shop-state p {
      max-width: 460px;
      margin: 0 auto 18px;
      font-size: 11px;
      line-height: 1.7;
    }

    .shop-retry-btn {
      min-width: 120px;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .shop-retry-btn:hover {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .shop-skeleton-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .shop-skeleton-card {
      overflow: hidden;
      border: 1px solid var(--shop-border);
      border-radius: 6px;
      background: var(--shop-card);
    }

    .shop-skeleton-image,
    .shop-skeleton-line {
      background: linear-gradient(100deg, #141414 30%, #1d1d1d 50%, #141414 70%);
      background-size: 200% 100%;
      animation: shopShimmer 1.4s infinite;
    }

    .shop-skeleton-image {
      width: 100%;
      aspect-ratio: 1 / 1.12;
    }

    .shop-skeleton-copy {
      padding: 14px;
    }

    .shop-skeleton-line {
      height: 10px;
      margin-bottom: 9px;
      border-radius: 2px;
    }

    .shop-skeleton-line.wide {
      width: 78%;
    }

    .shop-skeleton-line.medium {
      width: 52%;
    }

    .shop-skeleton-line.small {
      width: 30%;
    }

    @keyframes shopShimmer {
      from {
        background-position: 200% 0;
      }
      to {
        background-position: -200% 0;
      }
    }

    @media (max-width: 1100px) {
      .shop-header-bar {
        grid-template-columns: minmax(0, 1fr) minmax(180px, 240px) auto;
      }
      .shop-title-area {
        grid-column: 1 / -1;
      }
      .products-grid,
      .shop-skeleton-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .shop-container {
        padding: 18px 12px 64px;
      }
      .shop-header-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 12px 0;
        margin-bottom: 18px;
      }
      .shop-title-area {
        grid-column: 1 / -1;
      }
      .filter-strip {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
      }
      .search-wrap {
        grid-column: 1 / 2;
        grid-row: 3;
      }
      .sort-wrap {
        grid-column: 2 / 3;
        grid-row: 3;
        width: 140px;
      }
      .products-grid,
      .shop-skeleton-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shop-skeleton-image,
      .shop-skeleton-line,
      .p-thumb img,
      .p-card {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
        <img src="https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/logo.png" alt="BULKKOT logo" class="brand-logo" width="36" height="36" style="width:36px; height:36px;">
        <span class="brand-name">
          <span class="brand-korean" style="color:var(--bk-red, #e31b23); font-weight:700;">불꽃</span>
          <span class="brand-english" style="color:#fff; font-weight:900;">BULKKOT</span>
        </span>
      </a>
      <div class="header-actions">
        <a href="index.html" class="nav-btn" style="color:#aaa; font-size:11px; font-weight:700; text-decoration:none;">← HOME</a>
        <button type="button" class="header-action cart-action" data-open-cart aria-label="Open cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 5h2l1.7 11h9.8L20 8H7"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="17" cy="20" r="1"></circle>
          </svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shop-container">
    <section class="shop-header-bar" aria-label="Catalogue controls">
      <div class="shop-title-area">
        <h1>SILHOUETTES</h1>
        <p>LESS NOISE. MORE PRESENCE.</p>
      </div>

      <div class="filter-strip" id="filterStrip" role="tablist" aria-label="Filter products">
        <button type="button" class="filter-btn active" data-category="all" role="tab" aria-selected="true">ALL</button>
        <button type="button" class="filter-btn" data-category="tees" role="tab" aria-selected="false">TEES</button>
        <button type="button" class="filter-btn" data-category="hoodies" role="tab" aria-selected="false">HOODIES</button>
        <button type="button" class="filter-btn" data-category="sweats" role="tab" aria-selected="false">SWEATS</button>
      </div>

      <div class="search-wrap">
        <input id="shopSearch" class="shop-search" type="search" placeholder="SEARCH SILHOUETTES" aria-label="Search silhouettes">
      </div>

      <div class="sort-wrap">
        <select id="shopSort" class="shop-sort" aria-label="Sort products">
          <option value="featured">FEATURED</option>
          <option value="newest">NEWEST</option>
          <option value="price-low">PRICE: LOW → HIGH</option>
          <option value="price-high">PRICE: HIGH → LOW</option>
          <option value="name">NAME: A → Z</option>
        </select>
      </div>
    </section>

    <section id="shopLoading" class="shop-skeleton-grid" aria-label="Loading catalogue">
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line wide"></div><div class="shop-skeleton-line medium"></div></div></article>
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line wide"></div><div class="shop-skeleton-line medium"></div></div></article>
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line wide"></div><div class="shop-skeleton-line medium"></div></div></article>
      <article class="shop-skeleton-card"><div class="shop-skeleton-image"></div><div class="shop-skeleton-copy"><div class="shop-skeleton-line wide"></div><div class="shop-skeleton-line medium"></div></div></article>
    </section>

    <section id="shopError" class="shop-state" hidden aria-live="polite">
      <strong>CATALOGUE UNAVAILABLE</strong>
      <p>We couldn't load silhouettes right now. Please try again.</p>
      <button type="button" id="shopRetryBtn" class="shop-retry-btn">RETRY</button>
    </section>

    <section id="shopEmpty" class="shop-state" hidden aria-live="polite">
      <strong>NO SILHOUETTES FOUND</strong>
      <p id="shopEmptyText">Try another search or clear your filters.</p>
      <button type="button" id="shopClearBtn" class="shop-retry-btn">CLEAR FILTERS</button>
    </section>

    <section id="productsGrid" class="products-grid" aria-label="BULKKOT products" hidden></section>
  </main>

  <div class="drawer-overlay" data-cart-overlay></div>
  <aside class="cart-drawer" id="cart-drawer" data-cart-drawer aria-hidden="true"></aside>

  <script src="js/cart.js"></script>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://pgubjluqgqvrybvehzeh.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_JczzlCxDhkDctBeTuGhEjg_mkOtJIyP";
      const FALLBACK_IMG = "https://raw.githubusercontent.com/Bulkkotwear/bulkkot/main/13575.png";
      const SIZES = ["S", "M", "L", "XL"];

      const supabaseClient = window.supabase && typeof window.supabase.createClient === "function"
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

      const loadingEl = document.getElementById("shopLoading");
      const errorEl = document.getElementById("shopError");
      const emptyEl = document.getElementById("shopEmpty");
      const emptyTextEl = document.getElementById("shopEmptyText");
      const productsGrid = document.getElementById("productsGrid");
      const retryBtn = document.getElementById("shopRetryBtn");
      const clearBtn = document.getElementById("shopClearBtn");
      const searchInput = document.getElementById("shopSearch");
      const sortSelect = document.getElementById("shopSort");
      const filterStrip = document.getElementById("filterStrip");

      let products = [];
      let filteredProducts = [];
      let activeCategory = "all";
      let searchTerm = "";
      let sortMode = "featured";
      const quickAddSelections = new Map();

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function formatPrice(value) {
        return \`₹\${Number(value || 0).toLocaleString("en-IN")}\`;
      }

      function getImages(product) {
        const candidates = [];
        if (Array.isArray(product?.images)) candidates.push(...product.images);
        [product?.image, product?.image_url, product?.imageUrl].forEach(val => val && candidates.push(val));
        return [...new Set(candidates.map(v => String(v || "").trim()).filter(Boolean))];
      }

      function getStock(product) {
        return product?.stock && typeof product.stock === "object" && !Array.isArray(product.stock) ? product.stock : {};
      }

      function getAvailableSizes(product) {
        const stock = getStock(product);
        return SIZES.filter(size => Number(stock[size] || 0) > 0);
      }

      function setState(state) {
        if (loadingEl) loadingEl.hidden = state !== "loading";
        if (errorEl) errorEl.hidden = state !== "error";
        if (emptyEl) emptyEl.hidden = state !== "empty";
        if (productsGrid) productsGrid.hidden = state !== "products";
      }

      function applyFilters() {
        const term = searchTerm.trim().toLowerCase();
        filteredProducts = products.filter((product) => {
          if (product.active === false) return false;
          if (activeCategory !== "all" && String(product?.category || "").trim().toLowerCase() !== activeCategory) return false;
          if (term) {
            const searchText = [product?.name, product?.description, product?.category, product?.fit].filter(Boolean).join(" ").toLowerCase();
            if (!searchText.includes(term)) return false;
          }
          return true;
        });

        filteredProducts.sort((a, b) => {
          switch (sortMode) {
            case "newest": return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0);
            case "price-low": return Number(a.price || 0) - Number(b.price || 0);
            case "price-high": return Number(b.price || 0) - Number(a.price || 0);
            case "name": return String(a.name || "").localeCompare(String(b.name || ""));
            case "featured":
            default: return (b.featured === true ? 1 : 0) - (a.featured === true ? 1 : 0);
          }
        });

        renderProducts();
      }

      function renderProducts() {
        if (!filteredProducts.length) {
          if (emptyTextEl) emptyTextEl.textContent = searchTerm ? \`No silhouettes match "\${searchTerm}".\` : "Try another category or clear your filters.";
          setState("empty");
          productsGrid.innerHTML = "";
          return;
        }

        productsGrid.innerHTML = filteredProducts.map((product) => {
          const id = String(product?.id ?? "");
          const name = product?.name || "Untitled Garment";
          const image = getImages(product)[0] || FALLBACK_IMG;
          const available = getAvailableSizes(product);
          const soldOut = available.length === 0;
          const selected = quickAddSelections.get(id) || available[0] || null;

          return \`
            <article class="p-card">
              <a href="product.html?id=\${encodeURIComponent(id)}" class="p-card-link">
                <div class="p-thumb\${soldOut ? " is-sold-out" : ""}">
                  <img src="\${escapeHtml(image)}" alt="\${escapeHtml(name)}" loading="lazy" decoding="async">
                  <span class="p-tag">\${escapeHtml(String(product?.category || "ESSENTIAL").toUpperCase())}</span>
                  \${soldOut ? '<span class="p-sold-out-badge">SOLD OUT</span>' : ''}
                </div>
                <div class="p-info">
                  <div class="p-copy">
                    <h3>\${escapeHtml(name)}</h3>
                    <p class="p-sub">\${escapeHtml(product?.fit || product?.fabric || "")}</p>
                  </div>
                  <div class="p-meta">
                    <span class="p-price">\${formatPrice(product?.price)}</span>
                    <span class="p-btn-view">VIEW PIECE</span>
                  </div>
                </div>
              </a>
              <div class="p-quickadd" data-quickadd-id="\${encodeURIComponent(id)}">
                \${SIZES.map((size) => {
                  const inStock = Number(getStock(product)[size] || 0) > 0;
                  const isActive = selected === size;
                  return \`
                    <button type="button" class="p-size-chip\${isActive ? " active" : ""}" data-size="\${size}" \${!inStock ? "disabled" : ""}>
                      \${size}
                    </button>
                  \`;
                }).join("")}
                <button type="button" class="p-quickadd-btn" data-quick-add \${soldOut ? "disabled" : ""}>
                  \${soldOut ? "SOLD OUT" : "ADD TO BAG"}
                </button>
              </div>
            </article>
          \`;
        }).join("");

        setState("products");
      }

      /* Quick-add & Filters Events */
      productsGrid.addEventListener("click", (event) => {
        const sizeBtn = event.target.closest(".p-size-chip");
        if (sizeBtn && !sizeBtn.disabled) {
          const wrapper = sizeBtn.closest("[data-quickadd-id]");
          const productId = decodeURIComponent(wrapper?.dataset.quickaddId || "");
          const size = sizeBtn.dataset.size;
          quickAddSelections.set(productId, size);
          wrapper.querySelectorAll(".p-size-chip").forEach(b => b.classList.toggle("active", b.dataset.size === size));
          return;
        }

        const addBtn = event.target.closest("[data-quick-add]");
        if (addBtn) {
          const wrapper = addBtn.closest("[data-quickadd-id]");
          const productId = decodeURIComponent(wrapper?.dataset.quickaddId || "");
          const product = products.find(i => String(i.id) === productId);
          if (!product) return;
          const available = getAvailableSizes(product);
          const size = quickAddSelections.get(productId) || available[0];
          if (!size || !window.BULKKOT_CART) return;

          window.BULKKOT_CART.addItem({
            id: product.id,
            name: product.name,
            price: Number(product.price || 0),
            size,
            image: getImages(product)[0] || FALLBACK_IMG,
            quantity: 1
          });
        }
      });

      filterStrip.addEventListener("click", (event) => {
        const btn = event.target.closest(".filter-btn");
        if (!btn) return;
        activeCategory = btn.dataset.category || "all";
        filterStrip.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
        applyFilters();
      });

      searchInput.addEventListener("input", () => {
        searchTerm = searchInput.value || "";
        applyFilters();
      });

      sortSelect.addEventListener("change", () => {
        sortMode = sortSelect.value || "featured";
        applyFilters();
      });

      clearBtn.addEventListener("click", () => {
        activeCategory = "all";
        searchTerm = "";
        searchInput.value = "";
        sortMode = "featured";
        sortSelect.value = "featured";
        filterStrip.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.category === "all"));
        applyFilters();
      });

      retryBtn.addEventListener("click", loadProducts);

      async function loadProducts() {
        setState("loading");
        if (!supabaseClient) {
          setState("error");
          return;
        }
        try {
          const { data, error } = await supabaseClient.from("products").select("*").order("created_at", { ascending: false });
          if (error) throw error;
          products = Array.isArray(data) ? data : [];
          quickAddSelections.clear();
          products.forEach(p => {
            const avail = getAvailableSizes(p);
            if (avail.length) quickAddSelections.set(String(p.id), avail[0]);
          });
          applyFilters();
        } catch (err) {
          console.error("Catalogue load error:", err);
          setState("error");
        }
      }

      loadProducts();
    })();
  </script>
</body>
</html>
